<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Gravação de voz — Painel Financeiro</title>
<style>
  :root{--paper:#fffdf8;--ink:#1B3B39;--soft:#6c817f;--gold:#d79b2e;--teal:#106E6B;--line:#dfecea}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;color:var(--ink)}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:26px;text-align:center;gap:16px}
  .mic{width:72px;height:72px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;flex:none}
  .mic.ouvindo{animation:pulso 1.1s ease-in-out infinite}
  @keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(16,110,107,.35)}50%{box-shadow:0 0 0 14px rgba(16,110,107,0)}}
  h1{font-size:15px;margin:0;font-weight:700}
  p{font-size:13px;color:var(--soft);margin:0;min-height:18px;max-width:280px}
  button{border:1px solid var(--line);background:#fff;color:var(--soft);font-size:12.5px;border-radius:20px;cursor:pointer;padding:7px 16px}
  button:hover{background:#f6f3ea}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mic ouvindo" id="mic">🎤</div>
    <h1 id="titulo">Ouvindo…</h1>
    <p id="status">Pode falar — essa janela fecha sozinha quando terminar.</p>
    <button id="cancelar" type="button">Cancelar</button>
  </div>

  <script>
    (function () {
      var statusEl = document.getElementById('status');
      var micEl = document.getElementById('mic');
      var tituloEl = document.getElementById('titulo');
      var cancelarBtn = document.getElementById('cancelar');
      var enviado = false;
      var reconhecedor = null;

      function enviar(tipo, dados) {
        if (enviado) return;
        enviado = true;
        try {
          if (window.opener) {
            var msg = Object.assign({ origem: 'tdbDitadoVoz', tipo: tipo }, dados || {});
            window.opener.postMessage(msg, '*');
          }
        } catch (e) {}
        setTimeout(function () { window.close(); }, tipo === 'resultado' ? 300 : 1100);
      }

      cancelarBtn.addEventListener('click', function () {
        try { if (reconhecedor) reconhecedor.abort(); } catch (e) {}
        window.close();
      });

      if (typeof window !== 'undefined' && window.isSecureContext === false) {
        tituloEl.textContent = 'Sem HTTPS';
        micEl.classList.remove('ouvindo');
        statusEl.textContent = 'A gravação de voz só funciona em HTTPS.';
        enviar('erro', { mensagem: 'A gravação de voz só funciona em HTTPS.' });
        return;
      }

      var Reconhecedor = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Reconhecedor) {
        tituloEl.textContent = 'Sem suporte';
        micEl.classList.remove('ouvindo');
        statusEl.textContent = 'Esse navegador não suporta gravação de voz. Use Chrome ou Edge.';
        enviar('erro', { mensagem: 'Seu navegador não suporta gravação de voz. Tenta pelo Chrome ou Edge.' });
        return;
      }

      reconhecedor = new Reconhecedor();
      reconhecedor.lang = 'pt-BR';
      reconhecedor.interimResults = false;
      reconhecedor.maxAlternatives = 1;

      reconhecedor.onresult = function (e) {
        var texto = Array.from(e.results).map(function (r) { return r[0].transcript; }).join(' ').trim();
        tituloEl.textContent = 'Prontinho!';
        micEl.classList.remove('ouvindo');
        statusEl.textContent = texto || '—';
        enviar('resultado', { texto: texto });
      };

      reconhecedor.onerror = function (event) {
        var motivos = {
          'not-allowed': 'Permissão de microfone negada nesta janela.',
          'service-not-allowed': 'Permissão de microfone negada pelo navegador.',
          'no-speech': 'Não ouvi nada. Tenta de novo, mais perto do microfone.',
          'audio-capture': 'Não encontrei nenhum microfone disponível.',
          'network': 'Sem conexão com o serviço de reconhecimento de voz.'
        };
        var mensagem = motivos[event.error] || ('Erro na gravação: ' + event.error);
        tituloEl.textContent = 'Ops';
        micEl.classList.remove('ouvindo');
        statusEl.textContent = mensagem;
        enviar('erro', { mensagem: mensagem });
      };

      reconhecedor.onend = function () {
        if (!enviado) {
          enviar('erro', { mensagem: 'Não ouvi nada. Tenta de novo.' });
        }
      };

      try {
        reconhecedor.start();
      } catch (erro) {
        tituloEl.textContent = 'Ops';
        micEl.classList.remove('ouvindo');
        statusEl.textContent = 'Não consegui iniciar a gravação.';
        enviar('erro', { mensagem: 'Não consegui iniciar a gravação: ' + (erro && erro.message) });
      }
    })();
  </script>
</body>
</html>
