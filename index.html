                            <Trash2 size={14} color={COLORS.red} />
                          </button>
                        </div>
                      )}
                    </div>
                  );})}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function nomeExibicao(categoria) {
  if (categoria.startsWith('Mensalidade - ')) return categoria.replace('Mensalidade - ', '');
  if (categoria.startsWith('Convênio - ')) return categoria.replace('Convênio - ', '');
  return categoria;
}
function tipoOrigem(categoria) {
  if (categoria.startsWith('Mensalidade - ')) return 'Aluno';
  if (categoria.startsWith('Convênio - ')) return 'Convênio';
  return 'Outra';
}

function formatarData(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function TabelaMensalidades({ titulo, itens, mostrarDetalhes, editandoId, iniciarEdicao, cancelarEdicao, salvarEdicao, darBaixa, darNota, removerLancamento,
  valorEdit, setValorEdit, valorCheioEdit, setValorCheioEdit, statusEdit, setStatusEdit, bancoEdit, setBancoEdit,
  paiEdit, setPaiEdit, tirarNotaEdit, setTirarNotaEdit, convenioEdit, setConvenioEdit, dataEdit, setDataEdit,
  okEdit, setOkEdit, inputStyle, modoPrivado }) {

  const th = { padding: '9px 8px', fontSize: 10.5, fontWeight: 700, color: COLORS.inkSoft, textTransform: 'uppercase', letterSpacing: '0.02em', textAlign: 'left', whiteSpace: 'nowrap' };
  const td = { padding: '8px 8px', fontSize: 12, color: COLORS.ink, borderTop: `1px solid ${COLORS.lineSoft}`, verticalAlign: 'middle' };
  const inputCell = { ...inputStyle, padding: '5px 7px', fontSize: 12, width: '100%', minWidth: 70, boxSizing: 'border-box' };

  return (
    <div style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: 'hidden' }}>
      <div style={{ padding: '12px 18px', background: COLORS.lineSoft, fontSize: 13, fontWeight: 700, color: COLORS.ink, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <span>{titulo} <span style={{ fontWeight: 500, color: COLORS.inkSoft }}>({modoPrivado ? '••' : itens.length})</span></span>
        <span style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 500 }}>Dica: Você pode digitar contas nos valores (ex: <b>900+150</b> ou <b>1483-200</b>) e salvar</span>
      </div>
      {itens.length === 0 ? (
        <div style={{ textAlign: 'center', color: COLORS.inkSoft, padding: '28px 0', fontSize: 13.5 }}>Nenhum registro encontrado.</div>
      ) : (
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', minWidth: mostrarDetalhes ? 1220 : 750, borderCollapse: 'collapse', tableLayout: 'fixed' }}>
            <colgroup>
              <col style={{ width: '20%' }} />
              {mostrarDetalhes && <col style={{ width: '6%' }} />}
              <col style={{ width: '15%' }} />
              <col style={{ width: '7%' }} />
              <col style={{ width: '6%' }} />
              {mostrarDetalhes && <col style={{ width: '13%' }} />}
              {mostrarDetalhes && <col style={{ width: '11%' }} />}
              {mostrarDetalhes && <col style={{ width: '8%' }} />}
              <col style={{ width: '7%' }} />
              <col style={{ width: '7%' }} />
            </colgroup>
            <thead>
              <tr>
                <th style={th}>Nome</th>
                {mostrarDetalhes && <th style={th}>Nota</th>}
                <th style={th}>Valor a pagar</th>
                <th style={th}>Status</th>
                <th style={th}>Banco</th>
                {mostrarDetalhes && <th style={th}>Pai / Responsável</th>}
                {mostrarDetalhes && <th style={th}>Tirar nota</th>}
                {mostrarDetalhes && <th style={th}>Convênio</th>}
                <th style={th}>Data</th>
                <th style={{ ...th, textAlign: 'center' }}>Ações</th>
              </tr>
            </thead>
            <tbody>
              {itens.map(t => {
                const emEdicao = editandoId === t.id;
                return (
                  <tr key={t.id} style={{ background: emEdicao ? '#FDF5FC' : 'transparent' }}>
                    <td style={{
                      ...td,
                      background: COLORS.goldSoft,
                      fontWeight: 700,
                      whiteSpace: 'normal',
                      wordBreak: 'break-word',
                      lineHeight: 1.35,
                      padding: '8px 10px',
                      boxSizing: 'border-box'
                    }}>
                      {nomeExibicao(t.categoria)}
                    </td>
                    {mostrarDetalhes && (
                      <td style={td}>
                        {!emEdicao && t.nota !== undefined && (
                          <button onClick={() => darNota(t.id)} title="Clique para alternar Nota enviada/pendente" style={{
                            border: `1px solid ${t.nota === 'Enviada' ? COLORS.green : COLORS.gold}44`, borderRadius: 20, padding: '3px 8px',
                            fontSize: 10, fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap',
                            color: t.nota === 'Enviada' ? COLORS.green : COLORS.gold, background: 'transparent',
                          }}>{t.nota === 'Enviada' ? 'ENVIADA' : 'PENDENTE'}</button>
                        )}
                      </td>
                    )}
                    <td style={td} className="mono">
                      {emEdicao ? (
                        <div style={{ display: 'grid', gap: 4 }}>
                          <select
                            defaultValue=""
                            onChange={e => {
                              if (e.target.value === '') return;
                              const val = e.target.value;
                              if (val.startsWith('p:')) {
                                const p = VALORES_PRESET[Number(val.replace('p:', ''))];
                                setValorCheioEdit(p.cheio ? formatBRLNumber(p.cheio) : '');
                                setValorEdit(formatBRLNumber(p.pago));
                              } else if (val.startsWith('v:')) {
                                const v = Number(val.replace('v:', ''));
                                setValorEdit(formatBRLNumber(v));
                              }
                            }}
                            style={{ ...inputCell, fontSize: 11, padding: '4px 6px', color: COLORS.gold, fontWeight: 700, background: '#FFFDF8' }}
                          >
                            <option value="">↓ Selecionar valor da lista...</option>
                            <optgroup label="Combinações (Cheio → Pago)">
                              {VALORES_PRESET.map((p, i) => (
                                <option key={'p-' + i} value={'p:' + i}>{rotuloPreset(p)}</option>
                              ))}
                            </optgroup>
                            <optgroup label="Valores Individuais das Fotos">
                              {VALORES_FOTOS.map((v, i) => (
                                <option key={'v-' + i} value={'v:' + v}>{formatBRL(v)}</option>
                              ))}
                            </optgroup>
                          </select>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
                            <input
                              value={valorCheioEdit}
                              onChange={e => setValorCheioEdit(e.target.value)}
                              onBlur={() => onBlurCalc(valorCheioEdit, setValorCheioEdit)}
                              onKeyDown={e => { if (e.key === 'Enter') salvarEdicao(t.id); if (e.key === 'Escape') cancelarEdicao(); }}
                              placeholder="cheio"
                              list="valores-fotos-lista"
                              className="mono"
                              style={{ ...inputCell, width: 75 }}
                              title="Valor cheio (aceita contas ex: 1483+200)"
                            />
                            <span style={{ fontSize: 11, color: COLORS.inkSoft }}>→</span>
                            <input
                              autoFocus
                              value={valorEdit}
                              onChange={e => setValorEdit(e.target.value)}
                              onBlur={() => onBlurCalc(valorEdit, setValorEdit)}
                              onKeyDown={e => { if (e.key === 'Enter') salvarEdicao(t.id); if (e.key === 'Escape') cancelarEdicao(); }}
                              placeholder="pago"
                              list="valores-fotos-lista"
                              className="mono"
                              style={{ ...inputCell, width: 75 }}
                              title="Valor pago (aceita contas ex: 900+150)"
                            />
                          </div>
                        </div>
                      ) : t.valor != null ? (
                        <span style={{ whiteSpace: 'nowrap' }}>
                          {t.valorCheio && t.valorCheio !== t.valor && (
                            <span style={{ color: COLORS.inkSoft, fontWeight: 400, marginRight: 5 }}>{formatBRLPrivado(t.valorCheio, modoPrivado)} →</span>
                          )}
                          <span style={{ fontWeight: 700 }}>{formatBRLPrivado(t.valor, modoPrivado)}</span>
                        </span>
                      ) : t.valorCheio ? (
                        <span style={{ whiteSpace: 'nowrap', color: COLORS.gold, fontWeight: 700 }}>{formatBRLPrivado(t.valorCheio, modoPrivado)}</span>
                      ) : (
                        <span style={{ color: COLORS.inkSoft }}>—</span>
                      )}
                    </td>
                    <td style={td}>
                      {emEdicao ? (
                        <select value={statusEdit} onChange={e => setStatusEdit(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') salvarEdicao(t.id); }} style={inputCell}>
                          <option>Pago</option>
                          <option>Pendente</option>
                        </select>
                      ) : (
                        <button onClick={() => darBaixa(t.id)} title="Clique para alternar Pago/Pendente" style={{
                          border: 'none', borderRadius: 20, padding: '4px 10px', fontSize: 10.5, fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap',
                          color: t.status === 'Pago' ? COLORS.green : COLORS.red,
                          background: t.status === 'Pago' ? COLORS.greenBg : COLORS.redBg,
                        }}>{t.status === 'Pago' ? 'PAGO' : 'PENDENTE'}</button>
                      )}
                    </td>
                    <td style={td}>
                      {emEdicao ? (
                        <select value={bancoEdit} onChange={e => setBancoEdit(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') salvarEdicao(t.id); }} style={inputCell}>
                          <option value="">— nenhum —</option>
                          {BANCOS.map(b => <option key={b} value={b}>{b}</option>)}
                        </select>
                      ) : t.banco ? (
                        <span style={{
                          fontSize: 10.5, fontWeight: 700, color: '#FFFFFF', background: corBanco(t.banco),
                          padding: '4px 6px', borderRadius: 20, whiteSpace: 'nowrap', display: 'inline-block',
                          width: 66, textAlign: 'center', boxSizing: 'border-box',
                        }}>{abrevBanco(t.banco)}</span>
                      ) : '—'}
                    </td>
                    {mostrarDetalhes && (
                      <td style={{ ...td, whiteSpace: 'normal', wordBreak: 'break-word', lineHeight: 1.3 }}>
                        {emEdicao ? <input value={paiEdit} onChange={e => setPaiEdit(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') salvarEdicao(t.id); }} style={inputCell} /> : (t.pai || '—')}
                      </td>
                    )}
                    {mostrarDetalhes && (
                      <td style={{ ...td, whiteSpace: 'normal', wordBreak: 'break-word', lineHeight: 1.3 }}>
                        {emEdicao ? <input value={tirarNotaEdit} onChange={e => setTirarNotaEdit(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') salvarEdicao(t.id); }} style={inputCell} /> : (t.tirarNota || '—')}
                      </td>
                    )}
                    {mostrarDetalhes && (
                      <td style={td}>
                        {emEdicao ? (
                          <input value={convenioEdit} onChange={e => setConvenioEdit(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') salvarEdicao(t.id); }} list="convenios-lista" style={inputCell} />
                        ) : t.convenio && t.convenio !== 'PARTICULAR' ? (
                          <span title={t.convenio} style={{
                            fontSize: 10, fontWeight: 700, color: COLORS.green, background: COLORS.greenBg,
                            padding: '4px 8px', borderRadius: 20, whiteSpace: 'nowrap', display: 'inline-block',
                            overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: '100%', boxSizing: 'border-box',
                          }}>{abrevConvenio(t.convenio)}</span>
                        ) : (
                          <span style={{
                            fontSize: 10, fontWeight: 700, color: COLORS.inkSoft, background: COLORS.lineSoft,
                            padding: '4px 8px', borderRadius: 20, whiteSpace: 'nowrap', display: 'inline-block',
                          }}>PARTICULAR</span>
                        )}
                      </td>
                    )}
                    <td style={td}>
                      {emEdicao ? (
                        <input type="date" value={dataEdit} onChange={e => setDataEdit(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') salvarEdicao(t.id); }} style={{ ...inputCell, width: 130 }} />
                      ) : formatarData(t.data)}
                    </td>
                    <td style={{ ...td, whiteSpace: 'nowrap', textAlign: 'center' }}>
                      {emEdicao ? (
                        <div style={{ display: 'flex', gap: 4, alignItems: 'center', justifyContent: 'center' }}>
                          <button
                            onClick={() => salvarEdicao(t.id)}
                            title="Salvar alterações (ou aperte Enter)"
                            style={{
                              background: COLORS.green,
                              color: '#FFFFFF',
                              border: 'none',
                              borderRadius: 6,
                              padding: '5px 9px',
                              fontSize: 11.5,
                              fontWeight: 700,
                              cursor: 'pointer',
                              display: 'flex',
                              alignItems: 'center',
                              gap: 4,
                              boxShadow: '0 1px 3px rgba(46,140,137,0.3)',
                            }}
                          >
                            <Check size={13} color="#FFFFFF" /> Salvar
                          </button>
                          <button
                            onClick={cancelarEdicao}
                            title="Cancelar edição (ou aperte Esc)"
                            style={{
                              background: COLORS.redBg,
                              color: COLORS.red,
                              border: `1px solid ${COLORS.red}44`,
                              borderRadius: 6,
                              padding: '5px 8px',
                              fontSize: 11.5,
                              fontWeight: 700,
                              cursor: 'pointer',
                              display: 'flex',
                              alignItems: 'center',
                            }}
                          >
                            <X size={13} color={COLORS.red} />
                          </button>
                        </div>
                      ) : (
                        <div style={{ display: 'flex', gap: 4, alignItems: 'center', justifyContent: 'center' }}>
                          <button
                            onClick={() => iniciarEdicao(t)}
                            title="Editar lançamento"
                            style={{
                              background: '#FFFDF8',
                              border: `1px solid ${COLORS.line}`,
                              borderRadius: 5,
                              cursor: 'pointer',
                              padding: '4px 7px',
                              color: COLORS.ink,
                              display: 'flex',
                              alignItems: 'center',
                              gap: 3,
                              fontSize: 11,
                              fontWeight: 600,
                            }}
                          >
                            <Pencil size={11} color={COLORS.ink} /> Editar
                          </button>
                          <button
                            onClick={() => removerLancamento(t.id)}
                            title="Excluir lançamento"
                            style={{
                              background: '#FFFDF8',
                              border: `1px solid ${COLORS.line}`,
                              borderRadius: 5,
                              cursor: 'pointer',
                              padding: '4px 6px',
                              color: COLORS.red,
                              display: 'flex',
                              alignItems: 'center',
                            }}
                          >
                            <Trash2 size={12} color={COLORS.red} />
                          </button>
                        </div>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function Mensalidades({ transacoes, darBaixa, darNota, editarLancamento, removerLancamento, adicionarEntrada, privadoTotais, setPrivadoTotais, privadoDetalhes, setPrivadoDetalhes }) {
  const [filtroMes, setFiltroMes] = useState('AGOSTO');
  const [filtroStatus, setFiltroStatus] = useState('TODOS');
  const [filtroTexto, setFiltroTexto] = useState('');
  const [toastMsg, setToastMsg] = useState(null);
  function mostrarToast(msg) {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(null), 2600);
  }

  // carrega a tabela de referência de Valores (Particular/Convênios), só pra sugerir preço
  // no formulário de novo registro — não altera nada em Valores a partir daqui
  const [tabelaValores, setTabelaValores] = useState(null);
  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get('valores_mensalidade', false);
        setTabelaValores(r && r.value ? JSON.parse(r.value) : SEED_VALORES);
      } catch (e) {
        setTabelaValores(SEED_VALORES);
      }
    })();
  }, []);
  const [sugestaoValor, setSugestaoValor] = useState('');

  const [editandoId, setEditandoId] = useState(null);
  const [valorEdit, setValorEdit] = useState('');
  const [valorCheioEdit, setValorCheioEdit] = useState('');
  const [statusEdit, setStatusEdit] = useState('Pago');
  const [bancoEdit, setBancoEdit] = useState('SICOOB');
  const [paiEdit, setPaiEdit] = useState('');
  const [tirarNotaEdit, setTirarNotaEdit] = useState('');
  const [convenioEdit, setConvenioEdit] = useState('PARTICULAR');
  const [dataEdit, setDataEdit] = useState('');
  const [okEdit, setOkEdit] = useState('');

  const [novoTipoOrigem, setNovoTipoOrigem] = useState('Aluno');
  const [novoNome, setNovoNome] = useState('');
  const [novoPai, setNovoPai] = useState('');
  const [novoConvenio, setNovoConvenio] = useState('PARTICULAR');
  const [novoTirarNota, setNovoTirarNota] = useState('');
  const [novoMes, setNovoMes] = useState('AGOSTO');
  const [novoValor, setNovoValor] = useState('');
  const [novoValorCheio, setNovoValorCheio] = useState('');
  const [novoBanco, setNovoBanco] = useState('SICOOB');
  const [bancoOutroModo, setBancoOutroModo] = useState(false);
  const [novoStatus, setNovoStatus] = useState('Pago');
  const [formErro, setFormErro] = useState('');

  const inputStyle = {
    border: `1px solid ${COLORS.line}`, borderRadius: 7, padding: '9px 11px', fontSize: 13.5,
    fontFamily: 'Inter, sans-serif', background: '#FFFDF8', color: COLORS.ink,
  };

  const entradas = useMemo(() => transacoes.filter(t => t.tipo === 'Entrada'), [transacoes]);

  const semFiltroNenhum = filtroMes === 'TODOS' && !filtroTexto;
  const filtradasCompleto = useMemo(() => {
    return entradas
      .filter(t => filtroMes === 'TODOS' || t.mes === filtroMes)
      .filter(t => filtroStatus === 'TODOS' || t.status === filtroStatus)
      .filter(t => !filtroTexto || nomeExibicao(t.categoria).toLowerCase().includes(filtroTexto.toLowerCase()) || (t.pai || '').toLowerCase().includes(filtroTexto.toLowerCase()))
      .sort((a, b) => nomeExibicao(a.categoria).localeCompare(nomeExibicao(b.categoria)));
  }, [entradas, filtroMes, filtroStatus, filtroTexto]);

  const filtradas = semFiltroNenhum ? filtradasCompleto.slice(0, 100) : filtradasCompleto;

  const alunosLista = useMemo(() => filtradas.filter(t => t.categoria.startsWith('Mensalidade - ')), [filtradas]);
  const empresasLista = useMemo(() => filtradas.filter(t => !t.categoria.startsWith('Mensalidade - ')), [filtradas]);

  const resumo = useMemo(() => {
    const doMes = filtroMes === 'TODOS' ? filtradas : entradas.filter(t => t.mes === filtroMes);
    const pendentes = doMes.filter(t => t.status === 'Pendente');
    const pagos = doMes.filter(t => t.status === 'Pago');
    return {
      qtdPendente: pendentes.length,
      valorPendente: pendentes.reduce((s, t) => s + (t.valor || 0), 0),
      qtdPago: pagos.length,
      valorPago: pagos.reduce((s, t) => s + (t.valor || 0), 0),
    };
  }, [filtradas, entradas, filtroMes]);

  function iniciarEdicao(t) {
    setEditandoId(t.id);
    setValorEdit(t.valor != null ? formatBRLNumber(t.valor) : '');
    setValorCheioEdit(t.valorCheio != null ? formatBRLNumber(t.valorCheio) : '');
    setStatusEdit(t.status);
    setBancoEdit(t.banco || '');
    setPaiEdit(t.pai || '');
    setTirarNotaEdit(t.tirarNota || '');
    setConvenioEdit(t.convenio || 'PARTICULAR');
    setDataEdit(t.data || '');
    setOkEdit(t.ok || (t.status === 'Pago' ? 'OK' : ''));
  }
  function cancelarEdicao() { setEditandoId(null); }
  function salvarEdicao(id) {
    const valorFinal = parseBRLInput(valorEdit);
    const valorCheioFinal = parseBRLInput(valorCheioEdit);
    editarLancamento(id, {
      valor: valorFinal,
      valorCheio: valorCheioFinal,
      status: statusEdit, banco: bancoEdit, pai: paiEdit, tirarNota: tirarNotaEdit, convenio: convenioEdit, data: dataEdit || null, ok: okEdit || null,
    });
    setEditandoId(null);
  }

  function submeterNovo(e) {
    e.preventDefault();
    setFormErro('');
    if (!novoNome.trim()) { setFormErro('Escreva o nome do aluno ou convênio.'); return; }
    const numPago = parseBRLInput(novoValor);
    const numCheio = parseBRLInput(novoValorCheio);
    // se só preencher "Valor a Pagar" e deixar "Valor Pago" em branco, usa o mesmo
    // valor pros dois — muito comum em convênio/empresa, que não tem desconto
    const num = (numPago && numPago > 0) ? numPago : numCheio;
    if (!num || num <= 0) { setFormErro('Coloque um valor válido em algum dos dois campos (Valor a Pagar ou Valor Pago).'); return; }
    const prefixo = novoTipoOrigem === 'Aluno' ? 'Mensalidade - ' : novoTipoOrigem === 'Convênio' ? 'Convênio - ' : '';
    const hoje = new Date();
    const dataHoje = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;
    adicionarEntrada({
      mes: novoMes, categoria: prefixo + novoNome.trim().toUpperCase(), tipo: 'Entrada',
      valor: num,
      valorCheio: numCheio,
      status: novoStatus, banco: novoBanco,
      pai: novoTipoOrigem === 'Aluno' ? (novoPai.trim() || null) : null,
      convenio: novoTipoOrigem === 'Aluno' ? (novoConvenio.trim() || 'PARTICULAR') : null,
      tirarNota: novoTirarNota.trim() || null,
      nota: novoTipoOrigem === 'Aluno' ? 'Pendente' : undefined,
      data: dataHoje, // preenche sozinho com a data de hoje — dá pra mudar depois no lápis de editar
    });
    mostrarToast(`✓ ${novoNome.trim()} adicionado com sucesso!`);
    setNovoNome(''); setNovoValor(''); setNovoValorCheio(''); setNovoPai(''); setNovoConvenio('PARTICULAR'); setNovoTirarNota('');
  }

  const linhaHandlers = {
    editandoId, iniciarEdicao, cancelarEdicao, salvarEdicao, darBaixa, darNota, removerLancamento,
    valorEdit, setValorEdit, valorCheioEdit, setValorCheioEdit,
    statusEdit, setStatusEdit, bancoEdit, setBancoEdit,
    paiEdit, setPaiEdit, tirarNotaEdit, setTirarNotaEdit, convenioEdit, setConvenioEdit, dataEdit, setDataEdit, okEdit, setOkEdit, inputStyle,
  };

  return (
    <div style={{ display: 'grid', gap: 20 }}>
      <Toast mensagem={toastMsg} />
      <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
        <button onClick={() => setPrivadoTotais(v => !v)} title={privadoTotais ? 'Mostrar totais' : 'Esconder totais'} style={{
          background: 'none', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 5,
          color: COLORS.inkSoft, fontSize: 11.5, fontWeight: 600,
        }}>
          {privadoTotais ? <EyeOff size={15} /> : <Eye size={15} />}
          {privadoTotais ? 'Totais ocultos' : 'Ocultar totais'}
        </button>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 14 }}>
        <div style={{ background: COLORS.redBg, border: `1px solid ${COLORS.red}22`, borderRadius: 10, padding: '14px 16px' }}>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: COLORS.red, textTransform: 'uppercase', letterSpacing: '0.03em' }}>Pendentes</div>
          <div className="mono" style={{ fontSize: 20, fontWeight: 700, color: COLORS.red }}>{privadoTotais ? '••' : resumo.qtdPendente} · {formatBRLPrivado(resumo.valorPendente, privadoTotais)}</div>
        </div>
        <div style={{ background: COLORS.greenBg, border: `1px solid ${COLORS.green}22`, borderRadius: 10, padding: '14px 16px' }}>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: COLORS.green, textTransform: 'uppercase', letterSpacing: '0.03em' }}>Recebidos</div>
          <div className="mono" style={{ fontSize: 20, fontWeight: 700, color: COLORS.green }}>{privadoTotais ? '••' : resumo.qtdPago} · {formatBRLPrivado(resumo.valorPago, privadoTotais)}</div>
        </div>
      </div>

      <div style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: '18px 20px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
          <Plus size={16} color={COLORS.gold} />
          <h3 className="serif" style={{ fontSize: 15, fontWeight: 600, margin: 0, color: COLORS.ink }}>Novo registro de entrada</h3>
          <span style={{ fontSize: 11.5, color: COLORS.inkSoft }}>— aceita contas nos valores (ex: 900+150 ou 1483-200)</span>
        </div>
        <form onSubmit={submeterNovo} style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10 }}>
            <div style={{ display: 'grid', gap: 4, flex: '1 1 110px' }}>
              <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>TIPO</label>
              <select value={novoTipoOrigem} onChange={e => setNovoTipoOrigem(e.target.value)} style={inputStyle}>
                <option>Aluno</option>
                <option>Convênio</option>
                <option>Outra</option>
              </select>
            </div>
            <div style={{ display: 'grid', gap: 4, flex: '2 1 200px' }}>
              <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>NOME</label>
              <input value={novoNome} onChange={e => setNovoNome(e.target.value)} placeholder="Nome do aluno/empresa" style={inputStyle} spellCheck="true" lang="pt-BR" />
            </div>
            <div style={{ display: 'grid', gap: 4, flex: '1 1 160px', opacity: novoTipoOrigem === 'Aluno' ? 1 : 0.4 }}>
              <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>PAI/RESPONSÁVEL</label>
              <input value={novoPai} onChange={e => setNovoPai(capitalizarPalavras(e.target.value))} placeholder="Opcional"
                disabled={novoTipoOrigem !== 'Aluno'} style={inputStyle} spellCheck="true" lang="pt-BR" />
            </div>
            <div style={{ display: 'grid', gap: 4, flex: '1 1 160px', opacity: novoTipoOrigem === 'Aluno' ? 1 : 0.4 }}>
              <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>CONVÊNIO</label>
              <select
                value={tabelaValores && Object.values(tabelaValores).some(g => g.nome.toUpperCase() === novoConvenio.toUpperCase()) ? novoConvenio.toUpperCase() : (novoConvenio ? 'OUTRO' : '')}
                onChange={e => { if (e.target.value !== 'OUTRO') setNovoConvenio(e.target.value); else setNovoConvenio(''); }}
                disabled={novoTipoOrigem !== 'Aluno'}
                style={inputStyle}
              >
                {tabelaValores && Object.values(tabelaValores).map(g => (
                  <option key={g.nome} value={g.nome.toUpperCase()}>{g.nome}</option>
                ))}
                <option value="OUTRO">Outro (digitar)…</option>
              </select>
              {(!tabelaValores || !Object.values(tabelaValores).some(g => g.nome.toUpperCase() === novoConvenio.toUpperCase())) && (
                <input value={novoConvenio} onChange={e => setNovoConvenio(capitalizarPalavras(e.target.value))} placeholder="Nome do convênio"
                  disabled={novoTipoOrigem !== 'Aluno'} style={inputStyle} spellCheck="true" lang="pt-BR" />
              )}
            </div>
            <div style={{ display: 'grid', gap: 4, flex: '1 1 160px' }}>
              <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>TIRAR NOTA</label>
              <input value={novoTirarNota} onChange={e => setNovoTirarNota(capitalizarPalavras(e.target.value))} placeholder="Opcional"
                style={inputStyle} spellCheck="true" lang="pt-BR" />
            </div>
          </div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, alignItems: 'end' }}>
            <div style={{ display: 'grid', gap: 4, flex: '1 1 90px' }}>
              <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>MÊS</label>
              <select value={novoMes} onChange={e => setNovoMes(e.target.value)} style={inputStyle}>
                {MESES.map(m => <option key={m} value={m}>{MESES_ABREV[m]}</option>)}
              </select>
            </div>
            <div style={{ display: 'grid', gap: 4, flex: '1 1 180px' }}>
              <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>SELECIONAR VALOR</label>
              <select
                defaultValue=""
                onChange={e => {
                  if (e.target.value === '') return;
                  const val = e.target.value;
                  if (val.startsWith('p:')) {
                    const p = VALORES_PRESET[Number(val.replace('p:', ''))];
                    setNovoValorCheio(p.cheio ? formatBRLNumber(p.cheio) : '');
                    setNovoValor(formatBRLNumber(p.pago));
                  } else if (val.startsWith('v:')) {
                    const v = Number(val.replace('v:', ''));
                    setNovoValor(formatBRLNumber(v));
                  } else if (val.startsWith('t:')) {
                    const [gKey, gIdx] = val.replace('t:', '').split('|');
                    const g = tabelaValores[gKey].grupos[Number(gIdx)];
                    setNovoValorCheio(formatBRLNumber(g.semDesconto));
                    setNovoValor(formatBRLNumber(g.comDesconto));
                  }
                }}
                style={{ ...inputStyle, color: COLORS.gold, fontWeight: 600 }}
              >
                <option value="">Escolher valor…</option>
                {tabelaValores && (
                  <optgroup label="📋 Tabela de Valores (Particular/Convênios)">
                    {Object.entries(tabelaValores).map(([gKey, g]) =>
                      g.grupos.map((sub, gIdx) => (
                        <option key={`t-${gKey}-${gIdx}`} value={`t:${gKey}|${gIdx}`}>
                          {g.nome} — {sub.titulo}: {formatBRL(sub.comDesconto)} / {formatBRL(sub.semDesconto)}
                        </option>
                      ))
                    )}
                  </optgroup>
                )}
                <optgroup label="Combinações (Cheio → Pago)">
                  {VALORES_PRESET.map((p, i) => (
                    <option key={'np-' + i} value={'p:' + i}>{rotuloPreset(p)}</option>
                  ))}
                </optgroup>
                <optgroup label="Valores Individuais das Fotos">
                  {VALORES_FOTOS.map((v, i) => (
                    <option key={'nv-' + i} value={'v:' + v}>{formatBRL(v)}</option>
                  ))}
                </optgroup>
              </select>
            </div>
            <div style={{ display: 'grid', gap: 4, flex: '1 1 110px' }}>
              <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>VALOR A PAGAR</label>
              <input
                value={novoValorCheio}
                onChange={e => setNovoValorCheio(e.target.value)}
                onBlur={() => onBlurCalc(novoValorCheio, setNovoValorCheio)}
                list="valores-fotos-lista"
                placeholder="Opcional"
                className="mono"
                style={inputStyle}
                title="Aceita contas como 1483+200"
              />
            </div>
            <div style={{ display: 'grid', gap: 4, flex: '1 1 110px' }}>
              <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>VALOR PAGO</label>
              <input
                value={novoValor}
                onChange={e => setNovoValor(e.target.value)}
                onBlur={() => onBlurCalc(novoValor, setNovoValor)}
                list="valores-fotos-lista"
                placeholder="0,00"
                className="mono"
                style={inputStyle}
                title="Aceita contas como 900+150"
              />
            </div>
            <div style={{ display: 'grid', gap: 4, flex: '1 1 110px' }}>
              <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>BANCO</label>
              <select value={bancoOutroModo ? 'Outro' : novoBanco} onChange={e => {
                if (e.target.value === 'Outro') { setBancoOutroModo(true); setNovoBanco(''); }
                else { setBancoOutroModo(false); setNovoBanco(e.target.value); }
              }} style={inputStyle}>
                <option value="">— nenhum —</option>
                {BANCOS.map(b => <option key={b} value={b}>{b}</option>)}
              </select>
              {bancoOutroModo && (
                <input autoFocus value={novoBanco} onChange={e => setNovoBanco(e.target.value.toUpperCase())} placeholder="Nome do banco" style={inputStyle} />
              )}
            </div>
            <div style={{ display: 'grid', gap: 4, flex: '1 1 100px' }}>
              <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>STATUS</label>
              <select value={novoStatus} onChange={e => setNovoStatus(e.target.value)} style={inputStyle}>
                <option>Pago</option>
                <option>Pendente</option>
              </select>
            </div>
            <button type="submit" style={{
              background: COLORS.inkButton, color: '#FFFFFF', border: 'none', borderRadius: 7, padding: '10px 16px',
              fontWeight: 600, fontSize: 13.5, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6, height: 39, justifyContent: 'center',
            }}><Plus size={15} /> Adicionar</button>
          </div>
        </form>
        {formErro && <div style={{ color: COLORS.red, fontSize: 12.5, marginTop: 10 }}>{formErro}</div>}
      </div>

      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
        <div style={{ position: 'relative', flex: '1 1 220px' }}>
          <Search size={15} color={COLORS.inkSoft} style={{ position: 'absolute', left: 12, top: 11 }} />
          <input value={filtroTexto} onChange={e => setFiltroTexto(e.target.value)} placeholder="Buscar por aluno ou pai..."
            style={{ ...inputStyle, width: '100%', paddingLeft: 34, boxSizing: 'border-box' }} />
        </div>
        <select value={filtroMes} onChange={e => setFiltroMes(e.target.value)} style={inputStyle}>
          <option value="TODOS">Todos os meses</option>
          {MESES.map(m => <option key={m} value={m}>{MESES_ABREV[m]}</option>)}
        </select>
        <select value={filtroStatus} onChange={e => setFiltroStatus(e.target.value)} style={inputStyle}>
          <option value="TODOS">Todos os status</option>
          <option value="Pago">Só pagos</option>
          <option value="Pendente">Só pendentes</option>
        </select>
        <button onClick={() => setPrivadoDetalhes(v => !v)} title={privadoDetalhes ? 'Mostrar valores da lista' : 'Esconder valores da lista'} style={{
          background: 'none', border: `1px solid ${COLORS.line}`, borderRadius: 7, cursor: 'pointer', padding: '9px 12px',
          display: 'flex', alignItems: 'center', gap: 5, color: COLORS.inkSoft, fontSize: 12.5, fontWeight: 600, height: 39, boxSizing: 'border-box',
        }}>
          {privadoDetalhes ? <EyeOff size={14} /> : <Eye size={14} />}
          {privadoDetalhes ? 'Lista oculta' : 'Ocultar lista'}
        </button>
      </div>
      {semFiltroNenhum && filtradasCompleto.length > 100 && (
        <div style={{ fontSize: 12.5, color: COLORS.gold, background: COLORS.goldSoft, borderRadius: 8, padding: '8px 12px' }}>
          Mostrando só os 100 primeiros de {filtradasCompleto.length} registros — escolha um mês ou busque um nome pra ver o resto (evita travar a tela).
        </div>
      )}

      <datalist id="convenios-lista">
        {CONVENIOS_CONHECIDOS.map(c => <option key={c} value={c} />)}
      </datalist>
      <datalist id="valores-fotos-lista">
        {VALORES_FOTOS.map((v, i) => (
          <option key={i} value={formatBRLNumber(v)} />
        ))}
      </datalist>

      <TabelaMensalidades titulo="Alunos" itens={alunosLista} mostrarDetalhes {...linhaHandlers} modoPrivado={privadoDetalhes} />
      <TabelaMensalidades titulo="Empresas / Convênios" itens={empresasLista} mostrarDetalhes={false} {...linhaHandlers} modoPrivado={privadoDetalhes} />
    </div>
  );
}

function Orcamento({ transacoes, modoPrivado, setModoPrivado }) {
  const [orcamentos, setOrcamentos] = useState(null); // { CATEGORIA: valorOrcado }
  const [metaLucro, setMetaLucro] = useState(null);
  const [metaLucroEdit, setMetaLucroEdit] = useState('');
  const [editandoMeta, setEditandoMeta] = useState(false);

  const [novaCategoria, setNovaCategoria] = useState('');
  const [novoValor, setNovoValor] = useState('');
  const [formErro, setFormErro] = useState('');
  const [buscaOrcamento, setBuscaOrcamento] = useState('');

  // lista das categorias de despesa (Fixa/Variável) já usadas em Lançamentos,
  // pra mostrar como sugestão de clique em vez de precisar digitar do zero
  const categoriasExistentes = useMemo(() => {
    if (!transacoes) return [];
    const set = new Set();
    transacoes.filter(t => t.tipo !== 'Entrada' && t.categoria).forEach(t => set.add(t.categoria));
    return Array.from(set).sort();
  }, [transacoes]);

  const [editandoCat, setEditandoCat] = useState(null);
  const [valorEditOrc, setValorEditOrc] = useState('');

  const inputStyle = {
    border: `1px solid ${COLORS.line}`, borderRadius: 7, padding: '9px 11px', fontSize: 13.5,
    fontFamily: 'Inter, sans-serif', background: '#FFFDF8', color: COLORS.ink,
  };

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get('orcamentos_categorias', false);
        setOrcamentos(r && r.value ? JSON.parse(r.value) : {});
      } catch (e) { setOrcamentos({}); }
      try {
        const m = await window.storage.get('meta_lucro_mensal', false);
        setMetaLucro(m && m.value ? Number(m.value) : null);
      } catch (e) { setMetaLucro(null); }
    })();
  }, []);

  async function salvarOrcamentos(next) {
    setOrcamentos(next);
    try { await window.storage.set('orcamentos_categorias', JSON.stringify(next), false); } catch (e) {}
  }
  async function salvarMeta(valor) {
    setMetaLucro(valor);
    try { await window.storage.set('meta_lucro_mensal', String(valor), false); } catch (e) {}
  }

  // mes mais recente com despesas reais lançadas (pra comparar orçado x realizado)
  const mesAtual = useMemo(() => {
    if (!transacoes) return 'AGOSTO';
    return [...MESES].reverse().find(m => transacoes.some(t => t.mes === m && t.tipo !== 'Entrada' && t.status === 'Pago')) || 'AGOSTO';
  }, [transacoes]);

  const gastoPorCategoria = useMemo(() => {
    const map = {};
    if (!transacoes) return map;
    transacoes.filter(t => t.mes === mesAtual && t.tipo !== 'Entrada' && t.status === 'Pago').forEach(t => {
      map[t.categoria] = (map[t.categoria] || 0) + (t.valor || 0);
    });
    return map;
  }, [transacoes, mesAtual]);

  const resultadoDoMes = useMemo(() => {
    if (!transacoes) return 0;
    const doMes = transacoes.filter(t => t.mes === mesAtual && t.status === 'Pago');
    const entradas = doMes.filter(t => t.tipo === 'Entrada').reduce((s, t) => s + (t.valor || 0), 0);
    const saidas = doMes.filter(t => t.tipo !== 'Entrada').reduce((s, t) => s + (t.valor || 0), 0);
    return entradas - saidas;
  }, [transacoes, mesAtual]);

  function submeterNovo(e) {
    e.preventDefault();
    setFormErro('');
    const cat = novaCategoria.trim().toUpperCase();
    const num = parseBRLInput(novoValor);
    if (!cat) { setFormErro('Escreva o nome da categoria.'); return; }
    if (!num || num <= 0) { setFormErro('Coloque um valor válido.'); return; }
    if (orcamentos[cat] != null) { setFormErro('Essa categoria já tem orçamento — edite direto na lista abaixo.'); return; }
    salvarOrcamentos({ ...orcamentos, [cat]: num });
    setNovaCategoria(''); setNovoValor('');
  }

  function iniciarEdicaoOrc(cat) {
    setEditandoCat(cat);
    setValorEditOrc(formatBRLNumber(orcamentos[cat]));
  }
  function salvarEdicaoOrc(cat) {
    const num = parseBRLInput(valorEditOrc);
    if (!num || num <= 0) return;
    salvarOrcamentos({ ...orcamentos, [cat]: num });
    setEditandoCat(null);
  }
  function removerOrcamento(cat) {
    if (!window.confirm(`Remover o orçamento de "${cat}"?`)) return;
    const next = { ...orcamentos };
    delete next[cat];
    salvarOrcamentos(next);
  }

  if (orcamentos === null) {
    return <div style={{ textAlign: 'center', color: COLORS.inkSoft, padding: 40 }}>Carregando...</div>;
  }

  const categorias = Object.keys(orcamentos)
    .filter(cat => !buscaOrcamento || cat.toLowerCase().includes(buscaOrcamento.toLowerCase()))
    .sort();
  const totalOrcado = categorias.reduce((s, c) => s + orcamentos[c], 0);
  const totalGasto = categorias.reduce((s, c) => s + (gastoPorCategoria[c] || 0), 0);

  return (
    <div style={{ display: 'grid', gap: 20 }}>
      <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
        <button onClick={() => setModoPrivado(v => !v)} title={modoPrivado ? 'Mostrar valores' : 'Esconder valores'} style={{
          background: 'none', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 5,
          color: COLORS.inkSoft, fontSize: 11.5, fontWeight: 600,
        }}>
          {modoPrivado ? <EyeOff size={15} /> : <Eye size={15} />}
          {modoPrivado ? 'Valores ocultos' : 'Ocultar valores'}
        </button>
      </div>
      {/* META DE LUCRO MENSAL */}
      <div style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: '16px 20px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 10 }}>
          <div>
            <div style={{ fontSize: 11.5, fontWeight: 700, color: COLORS.inkSoft, textTransform: 'uppercase', letterSpacing: '0.03em' }}>
              Meta de lucro mensal
            </div>
            {editandoMeta ? (
              <div style={{ display: 'flex', gap: 6, marginTop: 6, alignItems: 'center' }}>
                <input autoFocus value={metaLucroEdit} onChange={e => setMetaLucroEdit(e.target.value)}
                  onBlur={() => onBlurCalc(metaLucroEdit, setMetaLucroEdit)}
                  placeholder="0,00" className="mono" style={{ ...inputStyle, width: 140 }} />
                <button onClick={() => { const n = parseBRLInput(metaLucroEdit); if (n > 0) { salvarMeta(n); setEditandoMeta(false); } }}
                  style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4 }}><Check size={16} color={COLORS.green} /></button>
                <button onClick={() => setEditandoMeta(false)} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4 }}><X size={16} color={COLORS.inkSoft} /></button>
              </div>
            ) : (
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 2 }}>
                <span className="mono" style={{ fontSize: 22, fontWeight: 700, color: COLORS.ink }}>
                  {metaLucro ? formatBRLPrivado(metaLucro, modoPrivado) : '— não definida'}
                </span>
                <button onClick={() => { setMetaLucroEdit(metaLucro ? formatBRLNumber(metaLucro) : ''); setEditandoMeta(true); }}
                  style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4, opacity: 0.6 }}><Pencil size={13} color={COLORS.ink} /></button>
              </div>
            )}
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 11.5, fontWeight: 700, color: COLORS.inkSoft, textTransform: 'uppercase', letterSpacing: '0.03em' }}>
              Resultado real ({mesAtual.charAt(0) + mesAtual.slice(1).toLowerCase()})
            </div>
            <span className="mono" style={{ fontSize: 22, fontWeight: 700, color: resultadoDoMes >= 0 ? COLORS.green : COLORS.red }}>
              {formatBRLPrivado(resultadoDoMes, modoPrivado)}
            </span>
            {metaLucro && (
              <div style={{ fontSize: 12, color: resultadoDoMes >= metaLucro ? COLORS.green : COLORS.gold, marginTop: 2 }}>
                {resultadoDoMes >= metaLucro ? '✓ meta batida' : `faltam ${formatBRLPrivado(metaLucro - resultadoDoMes, modoPrivado)} pra meta`}
              </div>
            )}
          </div>
        </div>
        {metaLucro > 0 && (
          <div style={{ marginTop: 12 }}>
            <div style={{ height: 10, background: COLORS.lineSoft, borderRadius: 6, overflow: 'hidden' }}>
              <div style={{
                height: '100%',
                width: `${Math.min(100, Math.max(0, (resultadoDoMes / metaLucro) * 100))}%`,
                background: resultadoDoMes >= metaLucro ? COLORS.green : COLORS.gold,
                borderRadius: 6,
                transition: 'width 0.4s ease',
              }} />
            </div>
            <div style={{ fontSize: 10.5, color: COLORS.inkSoft, marginTop: 3, textAlign: 'right' }}>
              {modoPrivado ? '••%' : `${Math.round(Math.max(0, (resultadoDoMes / metaLucro) * 100))}% da meta`}
            </div>
          </div>
        )}
      </div>

      {/* NOVO ORÇAMENTO POR CATEGORIA */}
      <div style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: '18px 20px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
          <Plus size={16} color={COLORS.gold} />
          <h3 className="serif" style={{ fontSize: 15, fontWeight: 600, margin: 0, color: COLORS.ink }}>Definir orçamento de uma categoria</h3>
        </div>
        <form onSubmit={submeterNovo} style={{ display: 'flex', flexWrap: 'wrap', gap: 10, alignItems: 'end' }}>
          <div style={{ display: 'grid', gap: 4, flex: '2 1 220px' }}>
            <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>CATEGORIA</label>
            <input value={novaCategoria} onChange={e => setNovaCategoria(e.target.value)} list="categorias-despesa-lista"
              placeholder="ex: ALUGUEL, MERCADO..." style={inputStyle} spellCheck="true" lang="pt-BR" />
            <datalist id="categorias-despesa-lista">
              {categoriasExistentes.map(c => <option key={c} value={c} />)}
            </datalist>
          </div>
          <div style={{ display: 'grid', gap: 4, flex: '1 1 140px' }}>
            <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>VALOR MENSAL (R$)</label>
            <input value={novoValor} onChange={e => setNovoValor(e.target.value)}
              onBlur={() => onBlurCalc(novoValor, setNovoValor)}
              placeholder="0,00" inputMode="decimal" className="mono" style={inputStyle} />
          </div>
          <button type="submit" style={{
            background: COLORS.inkButton, color: '#FFFFFF', border: 'none', borderRadius: 7, padding: '10px 16px',
            fontWeight: 600, fontSize: 13.5, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6, height: 39,
          }}><Plus size={15} /> Adicionar</button>
        </form>
        {formErro && <div style={{ color: COLORS.red, fontSize: 12.5, marginTop: 10 }}>{formErro}</div>}
      </div>

      <div style={{ position: 'relative' }}>
        <Search size={15} color={COLORS.inkSoft} style={{ position: 'absolute', left: 12, top: 11 }} />
        <input value={buscaOrcamento} onChange={e => setBuscaOrcamento(e.target.value)} placeholder="Buscar categoria orçada..."
          style={{ ...inputStyle, width: '100%', paddingLeft: 34, boxSizing: 'border-box' }} spellCheck="true" lang="pt-BR" />
      </div>

      {/* TABELA ORÇADO x REALIZADO */}
      <div style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: 'hidden' }}>
        <div style={{ padding: '11px 18px', background: COLORS.lineSoft, fontSize: 12.5, fontWeight: 700, color: COLORS.ink, display: 'flex', justifyContent: 'space-between' }}>
          <span>Orçado x Realizado — {mesAtual.charAt(0) + mesAtual.slice(1).toLowerCase()}</span>
          <span className="mono">{formatBRLPrivado(totalGasto, modoPrivado)} / {formatBRLPrivado(totalOrcado, modoPrivado)}</span>
        </div>
        {categorias.length === 0 ? (
          <div style={{ textAlign: 'center', color: COLORS.inkSoft, padding: '30px 0', fontSize: 13.5 }}>
            {buscaOrcamento ? 'Nenhuma categoria encontrada com essa busca.' : 'Nenhuma categoria com orçamento ainda — adicione uma acima pra começar a acompanhar.'}
          </div>
        ) : (
          categorias.map(cat => {
            const orcado = orcamentos[cat];
            const gasto = gastoPorCategoria[cat] || 0;
            const pct = orcado > 0 ? Math.min(150, (gasto / orcado) * 100) : 0;
            const estourou = gasto > orcado;
            const emEdicao = editandoCat === cat;
            return (
              <div key={cat} style={{ padding: '12px 18px', borderTop: `1px solid ${COLORS.lineSoft}` }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8, marginBottom: 8 }}>
                  <span style={{ fontWeight: 700, color: COLORS.ink, fontSize: 13.5 }}>{cat}</span>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <span className="mono" style={{ fontSize: 12.5 }}>
                      <span style={{ color: estourou ? COLORS.red : COLORS.ink, fontWeight: 700 }}>{formatBRLPrivado(gasto, modoPrivado)}</span>
                      <span style={{ color: COLORS.inkSoft }}> / </span>
                      {emEdicao ? (
                        <input autoFocus value={valorEditOrc} onChange={e => setValorEditOrc(e.target.value)}
                          onBlur={() => onBlurCalc(valorEditOrc, setValorEditOrc)}
                          onKeyDown={e => { if (e.key === 'Enter') salvarEdicaoOrc(cat); if (e.key === 'Escape') setEditandoCat(null); }}
                          className="mono" style={{ ...inputStyle, width: 90, padding: '3px 6px', fontSize: 12 }} />
                      ) : (
                        <span style={{ color: COLORS.inkSoft }}>{formatBRLPrivado(orcado, modoPrivado)}</span>
                      )}
                    </span>
                    {emEdicao ? (
                      <>
                        <button onClick={() => salvarEdicaoOrc(cat)} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 3 }}><Check size={14} color={COLORS.green} /></button>
                        <button onClick={() => setEditandoCat(null)} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 3 }}><X size={14} color={COLORS.inkSoft} /></button>
                      </>
                    ) : (
                      <>
                        <button onClick={() => iniciarEdicaoOrc(cat)} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 3, opacity: 0.5 }}><Pencil size={12} color={COLORS.ink} /></button>
                        <button onClick={() => removerOrcamento(cat)} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 3, opacity: 0.5 }}><Trash2 size={13} color={COLORS.red} /></button>
                      </>
                    )}
                  </div>
                </div>
                <div style={{ background: COLORS.lineSoft, borderRadius: 20, height: 8, overflow: 'hidden' }}>
                  <div style={{ width: `${Math.min(100, pct)}%`, height: '100%', background: estourou ? COLORS.red : COLORS.green, borderRadius: 20 }} />
                </div>
                {estourou && (
                  <div style={{ fontSize: 11, color: COLORS.red, marginTop: 4 }}>
                    passou {formatBRLPrivado(gasto - orcado, modoPrivado)} do orçado
                  </div>
                )}
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

// Renderização na raiz
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PainelFinanceiro />);
  </script>
</body>
</html>
