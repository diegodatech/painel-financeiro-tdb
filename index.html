<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#FFFDF8">
  <title>Painel Financeiro - Tempo de Brincar</title>
  <link rel="manifest" href="./manifest.webmanifest?v=13">
  <link rel="icon" href="./icon-192.png?v=13">
  <link rel="apple-touch-icon" href="./icon-192.png?v=13">
  <style>
    :root{--paper:#fffdf8;--soft:#6c817f;--gold:#d79b2e;--line:#dfecea}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:var(--paper);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
    #painel{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--paper);z-index:1;opacity:0;pointer-events:none;transition:opacity .12s ease}
    #painel.visivel{opacity:1;pointer-events:auto}
    #splash{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity .12s ease,visibility .12s ease}
    #splash.oculto{opacity:0;visibility:hidden;pointer-events:none}
    .conteudo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
    .logo{width:min(46vw,220px);height:auto;max-height:150px;object-fit:contain}
    .status{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--soft);font-size:13px;font-weight:600}
    .spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--gold);animation:girar .8s linear infinite;flex:none}
    @keyframes girar{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="splash" aria-live="polite">
    <div class="conteudo">
      <img class="logo" src="./logo.png?v=13" alt="Escola Infantil Tempo de Brincar">
      <div class="status"><span class="spinner" aria-hidden="true"></span><span id="statusTxt">Abrindo painel…</span></div>
    </div>
  </div>
  <iframe id="painel" title="Painel Financeiro" allow="clipboard-read; clipboard-write; microphone"></iframe>

  <script>
    (() => {
      const LAUNCHER_VERSION = '14';
      const MOBILE_BUILD = '2.6';
      const APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbw0CRh3ZyFfQkjRz4vRhymlBd489xDWvswt4NlZt4nc_Lf6ZoDlTQh11OfTctiJaxnnTA/exec';
      const statusTxt = document.getElementById('statusTxt');

      function detectarCelular() {
        const ua = navigator.userAgent || '';
        const plataforma = navigator.platform || '';
        const pontosToque = navigator.maxTouchPoints || 0;

        const ehIPhone = /iPhone|iPod/i.test(ua);
        const ehIPad = /iPad/i.test(ua) || (plataforma === 'MacIntel' && pontosToque > 1);

        const ehAndroid = /Android/i.test(ua);
        const androidDizMobile = /Mobile/i.test(ua);

        const larguraViewport = Math.max(
          window.innerWidth || 0,
          document.documentElement.clientWidth || 0
        );

        const sw = Number(window.screen && window.screen.width) || 0;
        const sh = Number(window.screen && window.screen.height) || 0;
        const menorLadoTela = Math.min(sw || 9999, sh || 9999);
        const maiorLadoTela = Math.max(sw || 0, sh || 0);

        // iPad é sempre tratado como tablet.
        if (ehIPad) return false;

        // iPhone/iPod continuam na interface mobile.
        if (ehIPhone) return true;

        // Android sem "Mobile" no user-agent é tablet.
        if (ehAndroid && !androidDizMobile) return false;

        // Alguns tablets Android colocam "Mobile" no user-agent.
        // Nesse caso o tamanho real da tela tem prioridade sobre o user-agent.
        if (ehAndroid && androidDizMobile) {
          const pareceTablet =
            menorLadoTela >= 600 ||
            maiorLadoTela >= 900 ||
            larguraViewport >= 600;
          return !pareceTablet;
        }

        // Outros navegadores móveis conhecidos.
        if (/Windows Phone|IEMobile|Opera Mini|webOS|BlackBerry/i.test(ua)) return true;

        // Fallback: só classifica como telefone quando a viewport E a tela
        // realmente têm dimensões típicas de celular.
        return larguraViewport < 600 && menorLadoTela < 600;
      }

      function detectarSafariIOS() {
        const ua = navigator.userAgent || '';
        const iOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const safari = /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
        return iOS && safari;
      }

      async function limparCachesAntigos() {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister().catch(() => false)));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter(k => k.startsWith('tdb-launcher-')).map(k => caches.delete(k)));
          }
          try { localStorage.setItem('tdbLauncherVersion', LAUNCHER_VERSION); } catch (_) {}
        } catch (_) {}
      }

      const mobile = detectarCelular();
      const rota = mobile ? 'painelMobile' : 'painel';
      const frame = document.getElementById('painel');
      const splash = document.getElementById('splash');
      let liberado = false;
      let retryAutomatico = 0;

      function montarUrl(extra) {
        const qs = new URLSearchParams({
          acao: rota,
          pwa: '1',
          launcher: LAUNCHER_VERSION,
          build: mobile ? MOBILE_BUILD : 'desktop',
          _: Date.now().toString()
        });
        if (extra) Object.keys(extra).forEach(k => qs.set(k, String(extra[k])));
        return APPS_SCRIPT + '?' + qs.toString();
      }

      const revelar = () => {
        if (liberado) return;
        liberado = true;
        frame.classList.add('visivel');
        splash.classList.add('oculto');
      };

      async function iniciar() {
        if (statusTxt) statusTxt.textContent = mobile ? 'Abrindo versão celular…' : 'Abrindo painel…';
        await limparCachesAntigos();
        frame.src = montarUrl();
      }

      frame.addEventListener('load', revelar);
      setTimeout(revelar, 9000);

      // Se o painel reportar a falha temporária de abertura do Drive, o launcher
      // repete uma vez automaticamente. Assim o usuário não precisa tocar em
      // “Tentar novamente” quando a primeira resposta do Apps Script estiver fria/lenta.
      window.addEventListener('message', event => {
        const d = event && event.data;
        if (!d || d.type !== 'TDB_PAINEL_ERROR' || retryAutomatico >= 1) return;
        retryAutomatico += 1;
        if (statusTxt) statusTxt.textContent = 'Conexão lenta. Tentando novamente…';
        setTimeout(() => {
          frame.src = montarUrl({ retry: retryAutomatico });
        }, 700);
      });

      iniciar();
    })();
  </script>
  <script>
    // v14 — MOTOR DE VOZ DO LANÇADOR
    // O Apps Script não deixa o painel usar o microfone. Este lançador (página principal,
    // com permissão de microfone) escuta no lugar dele e devolve o texto em tempo real;
    // o painel mostra tudo num balão liquid glass, sem abrir outra página.
    (() => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const origemValida = o => /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/i.test(o || '');
      let sessao = null;

      const MENSAGENS_ERRO = {
        'not-allowed': 'O microfone está bloqueado para este app. Libere o microfone nas permissões do navegador (ícone de cadeado / "aA" na barra de endereço) e tente de novo.',
        'service-not-allowed': 'O reconhecimento de voz não está liberado neste navegador. Tente pelo Chrome ou Safari atualizados.',
        'audio-capture': 'Não encontrei nenhum microfone funcionando neste aparelho.',
        'network': 'Sem conexão com o serviço de voz. Verifique a internet e tente de novo.',
        'language-not-supported': 'O idioma português não está disponível no reconhecimento de voz deste aparelho.'
      };

      function enviar(s, dados) {
        try { s.fonte.postMessage(Object.assign({ origem: 'tdbLauncherVoz', id: s.id }, dados), s.origem); } catch (_) {}
      }

      function encerrar(s, tipo, extra) {
        if (!s || s.encerrada) return;
        s.encerrada = true;
        clearTimeout(s.tSilencio); clearTimeout(s.tMax);
        try { s.rec.onresult = s.rec.onerror = s.rec.onend = null; s.rec.abort(); } catch (_) {}
        if (sessao === s) sessao = null;
        if (tipo === 'resultado') enviar(s, { tipo: 'resultado', texto: (s.final + ' ' + s.parcial).replace(/\s+/g, ' ').trim() });
        else if (tipo === 'erro') enviar(s, Object.assign({ tipo: 'erro' }, extra));
      }

      function iniciar(event, d) {
        if (sessao) encerrar(sessao, 'cancelar');
        const s = { id: d.id, fonte: event.source, origem: event.origin, final: '', parcial: '', encerrada: false, parandoPeloUsuario: false };
        enviar(s, { tipo: 'recebido' });
        if (!SR) { enviar(s, { tipo: 'erro', mensagem: 'Este navegador não tem reconhecimento de voz.', permitirJanela: true }); return; }
        let rec;
        try { rec = new SR(); } catch (_) { enviar(s, { tipo: 'erro', mensagem: 'Não consegui iniciar o reconhecimento de voz.', permitirJanela: true }); return; }
        s.rec = rec;
        sessao = s;
        rec.lang = d.lang || 'pt-BR';
        rec.interimResults = true;
        rec.continuous = true;
        rec.maxAlternatives = 1;

        // Fecha sozinho após ~2,2 s de silêncio depois de falar, ou 60 s no total.
        const armarSilencio = () => {
          clearTimeout(s.tSilencio);
          s.tSilencio = setTimeout(() => { try { rec.stop(); } catch (_) { encerrar(s, 'resultado'); } }, 2200);
        };
        s.tMax = setTimeout(() => { try { rec.stop(); } catch (_) { encerrar(s, 'resultado'); } }, 60000);

        rec.onstart = () => enviar(s, { tipo: 'inicio' });
        rec.onresult = e => {
          let fin = '', par = '';
          for (let i = 0; i < e.results.length; i++) {
            const t = e.results[i][0] ? e.results[i][0].transcript : '';
            if (e.results[i].isFinal) fin += t + ' '; else par += t + ' ';
          }
          s.final = fin.replace(/\s+/g, ' ').trim();
          s.parcial = par.replace(/\s+/g, ' ').trim();
          enviar(s, { tipo: 'parcial', final: s.final, parcial: s.parcial });
          armarSilencio();
        };
        rec.onerror = e => {
          const codigo = e && e.error;
          if (codigo === 'no-speech' || codigo === 'aborted') { encerrar(s, 'resultado'); return; }
          const permitirJanela = codigo === 'not-allowed' || codigo === 'service-not-allowed';
          encerrar(s, 'erro', { codigo, mensagem: MENSAGENS_ERRO[codigo] || 'Não consegui reconhecer o que foi falado.', permitirJanela });
        };
        rec.onend = () => encerrar(s, 'resultado');
        try { rec.start(); }
        catch (_) { encerrar(s, 'erro', { mensagem: 'Não consegui ligar o microfone. Tente de novo.', permitirJanela: true }); }
      }

      window.addEventListener('message', event => {
        const d = event && event.data;
        if (!d || d.origem !== 'tdbPainel' || !origemValida(event.origin)) return;
        if (d.tipo === 'vozPing') {
          try { event.source.postMessage({ origem: 'tdbLauncherVoz', tipo: 'vozPong', suporta: !!SR }, event.origin); } catch (_) {}
        } else if (d.tipo === 'vozIniciar') {
          iniciar(event, d);
        } else if (d.tipo === 'vozParar' && sessao && sessao.id === d.id) {
          const s = sessao;
          s.parandoPeloUsuario = true;
          try { s.rec.stop(); } catch (_) { encerrar(s, 'resultado'); }
          setTimeout(() => encerrar(s, 'resultado'), 1500); // garantia caso o navegador não dispare onend
        } else if (d.tipo === 'vozCancelar' && sessao && sessao.id === d.id) {
          encerrar(sessao, 'cancelar');
        }
      });

      // Se o app for para segundo plano (ex.: bloqueou a tela), encerra e entrega o que já foi ouvido.
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && sessao) encerrar(sessao, 'resultado');
      });
    })();
  </script>
</body>
</html>
