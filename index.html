<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#106E6B">
  <title>Painel Financeiro - Tempo de Brincar</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    html,body{width:100%;height:100%;margin:0;background:#fffdf8;font-family:Arial,sans-serif;overflow:hidden}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;background:#fffdf8;color:#106e6b;font-weight:700}
    #loading span{display:inline-flex;align-items:center;gap:10px}
    #loading span:before{content:'';width:18px;height:18px;border:3px solid rgba(16,110,107,.2);border-top-color:#106e6b;border-radius:50%;animation:girar .8s linear infinite}
    @keyframes girar{to{transform:rotate(360deg)}}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fffdf8}
  </style>
</head>
<body>
  <div id="loading"><span>Abrindo Painel Financeiro…</span></div>
  <iframe
    id="painel"
    title="Painel Financeiro"
    allow="clipboard-read; clipboard-write"
    src="https://script.google.com/macros/s/AKfycbw0CRh3ZyFfQkjRz4vRhymlBd489xDWvswt4NlZt4nc_Lf6ZoDlTQh11OfTctiJaxnnTA/exec?acao=painel">
  </iframe>
  <script>
    const frame = document.getElementById('painel');
    const loading = document.getElementById('loading');
    frame.addEventListener('load', () => { loading.style.display = 'none'; });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
    }
  </script>
</body>
</html>
