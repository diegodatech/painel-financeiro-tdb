<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FFFDF8">
  <meta name="background-color" content="#FFFDF8">
  <title>Painel Financeiro - Tempo de Brincar</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="manifest" href="./manifest.webmanifest?v=6">
  <link rel="icon" href="./icon-192.png?v=6">
  <link rel="apple-touch-icon" href="./icon-192.png?v=6">
  <style>
    :root{--paper:#fffdf8;--soft:#6c817f;--gold:#d79b2e;--line:#dfecea}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:var(--paper);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
    #painel{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--paper);z-index:1;opacity:0;pointer-events:none;transition:opacity .12s ease}
    #painel.visivel{opacity:1;pointer-events:auto}
    #splash{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity .12s ease,visibility .12s ease}
    #splash.oculto{opacity:0;visibility:hidden;pointer-events:none}
    .conteudo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
    .logo{width:min(46vw,220px);height:auto;max-height:150px;object-fit:contain}
    .status{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--soft);font-size:13px;font-weight:600}
    .spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--gold);animation:girar .8s linear infinite;flex:none}
    @keyframes girar{to{transform:rotate(360deg)}}
    @media (min-width:900px){.logo{width:250px;max-height:170px}.status{font-size:14px}}
  </style>
</head>
<body>
  <div id="splash" aria-live="polite">
    <div class="conteudo">
      <img class="logo" src="./logo.png?v=6" alt="Escola Infantil Tempo de Brincar">
      <div class="status"><span class="spinner" aria-hidden="true"></span><span>Sincronizando Google Drive…</span></div>
    </div>
  </div>

  <iframe
    id="painel"
    title="Painel Financeiro"
    allow="clipboard-read; clipboard-write"
    src="https://script.google.com/macros/s/AKfycbw0CRh3ZyFfQkjRz4vRhymlBd489xDWvswt4NlZt4nc_Lf6ZoDlTQh11OfTctiJaxnnTA/exec?acao=painel&pwa=1&launcher=6">
  </iframe>

  <script>
    (() => {
      const frame = document.getElementById('painel');
      const splash = document.getElementById('splash');
      let liberado = false;

      const revelar = () => {
        if (liberado) return;
        liberado = true;
        frame.classList.add('visivel');
        splash.classList.add('oculto');
      };

      /*
       * v6 — mantém a lógica estável da v5 e elimina espera artificial postMessage do Apps Script.
       * O HtmlService do Google pode criar uma camada/iframe intermediária e a
       * mensagem de READY não chega de forma confiável ao launcher do GitHub.
       * Isso foi o que podia deixar a tela presa em “Sincronizando…” para sempre.
       *
       * Agora o launcher só cobre o carregamento inicial do iframe. Assim que a
       * página do Apps Script carrega, mostramos o próprio painel sem atraso extra. O index do
       * Apps Script já usa exatamente a mesma tela (logo + sincronizando), então
       * visualmente continua parecendo UMA única etapa até a tela do PIN.
       */
      frame.addEventListener('load', revelar, { once: true });

      // Segurança absoluta: nunca mais ficar bloqueado no splash do launcher.
      // Mesmo se o evento load for perdido por algum comportamento do WebView,
      // em até 4 s o próprio Apps Script assume a tela e mostra o estado real.
      setTimeout(revelar, 4000);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('./sw.js?v=6');
            await reg.update().catch(() => {});
          } catch (e) {
            console.warn('Service Worker não registrado:', e);
          }
        });
      }
    })();
  </script>
</body>
</html>
