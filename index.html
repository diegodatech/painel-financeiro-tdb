                      ativo={!!(editando && editando.tipo === 'notaCaso' && editando.casoIdx === casoIdx && editando.notaIdx === notaIdx)}
                      onClick={() => iniciarEdicaoNotaCaso(casoIdx, notaIdx, n.valor)}
                      onSalvar={salvarEdicao} onCancelar={() => setEditando(null)} oculto={modoPrivado} />
                    <button onClick={() => removerNotaCaso(casoIdx, notaIdx)} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 2, opacity: 0.4, display: 'flex' }}>
                      <Trash2 size={12} color={COLORS.red} />
                    </button>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function PainelFinanceiro() {
  const [transacoes, setTransacoes] = useState(null);
  const [loading, setLoading] = useState(true);
  const [storageOk, setStorageOk] = useState(true);
  const [modoPrivado, setModoPrivado] = useState(() => lerPreferencia('modoPrivado')); // esconde os valores (bolinhas) quando ligado — usado em Visão Geral e Orçamento
  // em Lançamentos e Mensalidades, os totais e a lista têm interruptores separados —
  // assim dá pra esconder só o resumo geral e continuar vendo os valores individuais pra trabalhar
  const [privadoTotais, setPrivadoTotais] = useState(() => lerPreferencia('privadoTotais'));
  const [privadoDetalhes, setPrivadoDetalhes] = useState(() => lerPreferencia('privadoDetalhes'));
  const [temaEscuro, setTemaEscuro] = useState(() => lerPreferencia('temaEscuro'));
  useEffect(() => { salvarPreferencia('temaEscuro', temaEscuro); }, [temaEscuro]);
  useEffect(() => { salvarPreferencia('modoPrivado', modoPrivado); }, [modoPrivado]);
  useEffect(() => { salvarPreferencia('privadoTotais', privadoTotais); }, [privadoTotais]);
  useEffect(() => { salvarPreferencia('privadoDetalhes', privadoDetalhes); }, [privadoDetalhes]);

  // PIN de proteção — guardado na Planilha Google (assim é o mesmo PIN pra quem acessar
  // de qualquer aparelho). "null" = ainda carregando; "" = nunca configurou um PIN.
  const [pinConfigurado, setPinConfigurado] = useState(null);
  const [desbloqueado, setDesbloqueado] = useState(false);
  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get('painel_pin', false);
        setPinConfigurado(r && r.value ? r.value : '');
      } catch (e) {
        setPinConfigurado('');
      }
    })();
  }, []);
  async function definirPin(novoPin) {
    try { await window.storage.set('painel_pin', novoPin, false); } catch (e) {}
    setPinConfigurado(novoPin);
    setDesbloqueado(true);
  }
  async function removerPin() {
    try { await window.storage.set('painel_pin', '', false); } catch (e) {}
    setPinConfigurado('');
    setDesbloqueado(true);
  }
  const [statusPlanilha, setStatusPlanilha] = useState(null); // null=modo local, 'ok'=sincronizando, 'erro'=falhou
  const [saldosMensais, setSaldosMensais] = useState(null); // { JANEIRO: 3111.69, ... } — editável na tela

  useEffect(() => {
    if (!window.APPS_SCRIPT_URL_CONFIGURADA) return;
    const t = setInterval(() => setStatusPlanilha(window.__statusPlanilha || null), 1500);
    return () => clearInterval(t);
  }, []);
  const [tab, setTab] = useState('visao');

  // filtros da aba lançamentos
  const [filtroMes, setFiltroMes] = useState('TODOS');
  const [filtroTexto, setFiltroTexto] = useState('');
  const [mesesAbertos, setMesesAbertos] = useState({});

  // form novo lançamento
  const [novoMes, setNovoMes] = useState('SETEMBRO');
  const [novaCategoria, setNovaCategoria] = useState('');
  const [novoTipo, setNovoTipo] = useState('Variável');
  const [novoValor, setNovoValor] = useState('');
  const [novoStatus, setNovoStatus] = useState('Pago');
  const [formErro, setFormErro] = useState('');
  const [formOk, setFormOk] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const result = await window.storage.get('transacoes_financas2026', false);
        if (result && result.value) {
          const lista = JSON.parse(result.value);
          // corrige datas que ficaram erradas por causa do Google Sheets ter
          // convertido sozinho o texto da data pro tipo Data dele (ex:
          // "2026-08-06T03:00:00.000Z" em vez de "2026-08-06") — pega só os
          // 10 primeiros caracteres (AAAA-MM-DD), que é o que o painel espera
          let precisouCorrigir = false;
          const corrigida = lista.map(t => {
            if (t.data && typeof t.data === 'string' && t.data.length > 10 && t.data.includes('T')) {
              precisouCorrigir = true;
              return { ...t, data: t.data.slice(0, 10) };
            }
            return t;
          });
          setTransacoes(corrigida);
          if (precisouCorrigir) {
            window.storage.set('transacoes_financas2026', JSON.stringify(corrigida), false);
          }
        } else {
          await window.storage.set('transacoes_financas2026', JSON.stringify(SEED_TRANSACOES), false);
          setTransacoes(SEED_TRANSACOES);
        }
      } catch (e) {
        setStorageOk(false);
        setTransacoes(SEED_TRANSACOES);
      }
      setLoading(false);
    })();
  }, []);

  // saldos mensais editáveis — sempre parte dos valores reais da planilha original (extrato)
  // como base, e por cima aplica qualquer edição manual já salva (mês a mês)
  useEffect(() => {
    (async () => {
      const base = {};
      SEED_SALDOS.forEach(s => { base[s.mes] = s.total; });
      try {
        const r = await window.storage.get('saldos_mensais', false);
        if (r && r.value) {
          setSaldosMensais({ ...base, ...JSON.parse(r.value) });
        } else {
          setSaldosMensais(base);
        }
      } catch (e) {
        setSaldosMensais(base);
      }
    })();
  }, []);

  async function salvarSaldoMensal(mes, valor) {
    const next = { ...(saldosMensais || {}), [mes]: valor };
    setSaldosMensais(next);
    try { await window.storage.set('saldos_mensais', JSON.stringify(next), false); } catch (e) {}
  }

  useEffect(() => {
    if (!transacoes) return;
    (async () => {
      let jaRodou = false;
      try {
        const marker = await window.storage.get('auto_lancamentos_v15', false);
        const marcadorTrue = !!(marker && marker.value === 'true');
        // se o marcador diz "já rodou" mas não sobrou NENHUM lançamento de Set-Dez,
        // é sinal de que os dados se perderam depois (ex: sobrescrita entre aparelhos)
        // — nesse caso, trata como "não rodou" e deixa repor sozinho
        const mesesFuturos = ['SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
        const temAlgumFuturo = transacoes.some(t => mesesFuturos.includes(t.mes));
        jaRodou = marcadorTrue && temAlgumFuturo;
      } catch (e) { /* chave ainda não existe */ }
      if (jaRodou) return;

      const mesesFuturos = ['SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
      const categoriasFixas = new Set(Object.keys(FIXAS_CONSISTENTES));
      const categoriasEntrada = new Set(Object.keys(ENTRADAS_CONSISTENTES));

      // Remove lançamentos futuros não pagos e duplicados
      let limpos = transacoes.filter(t => !(
        (mesesFuturos.includes(t.mes) && t.status !== 'Pago')
        || t.categoria === 'ENTRADAS DO MÊS'
      ));

      // Garante que o histórico detalhado (Jan-Ago) esteja presente
      const jaTemDetalhado = limpos.some(t => t.categoria.startsWith('Mensalidade -') || t.categoria.startsWith('Convênio -'));
      if (!jaTemDetalhado) {
        let maxIdHist = limpos.reduce((m, t) => Math.max(m, t.id), 0);
        const historico = SEED_TRANSACOES.filter(t => t.categoria.startsWith('Mensalidade -') || t.categoria.startsWith('Convênio -') || t.categoria === 'Mercado Pago (avulso)')
          .map(t => ({ ...t, id: ++maxIdHist }));
        limpos = [...limpos, ...historico];
      }

      const camposNovos = ['pai', 'tirarNota', 'convenio', 'banco', 'data', 'valorCheio', 'nota'];
      const refLookup = new Map();
      SEED_TRANSACOES.forEach(t => { refLookup.set(t.mes + '|' + t.categoria, t); });
      limpos = limpos.map(t => {
        if (!(t.categoria.startsWith('Mensalidade -') || t.categoria.startsWith('Convênio -'))) return t;
        const faltaAlgo = camposNovos.some(campo => t[campo] === undefined);
        if (!faltaAlgo) return t;
        const ref = refLookup.get(t.mes + '|' + t.categoria) || ALUNOS_INFO[t.categoria] || {};
        const patch = {};
        camposNovos.forEach(campo => { if (t[campo] === undefined) patch[campo] = ref[campo] ?? null; });
        return { ...t, ...patch };
      });

      const existentes = new Set(limpos.map(t => t.mes + '|' + t.categoria));
      let maxId = limpos.reduce((m, t) => Math.max(m, t.id), 0);
      const novos = [];

      // Despesas fixas (Setembro a Dezembro): apenas UMA linha por categoria por mês (sem duplicatas)
      categoriasFixas.forEach((categoria) => {
        mesesFuturos.forEach(mes => {
          if (!existentes.has(mes + '|' + categoria)) {
            maxId += 1;
            novos.push({ id: maxId, mes, categoria, tipo: 'Fixa', valor: null, status: 'Pendente' });
            existentes.add(mes + '|' + categoria);
          }
        });
      });

      // Entradas / Mensalidades (Setembro a Dezembro): apenas UMA linha por aluno/convênio por mês
      categoriasEntrada.forEach((categoria) => {
        mesesFuturos.forEach(mes => {
          if (!existentes.has(mes + '|' + categoria)) {
            maxId += 1;
            if (categoria.startsWith('Mensalidade -')) {
              const info = ALUNOS_INFO[categoria] || {};
              novos.push({
                id: maxId, mes, categoria, tipo: 'Entrada', valor: null, status: 'Pendente',
                pai: info.pai || null, tirarNota: info.tirarNota || null, banco: null,
                valorCheio: info.valorCheio || ENTRADAS_CONSISTENTES[categoria] || null,
                convenio: info.convenio || null,
                nota: null, data: null,
              });
            } else {
              novos.push({
                id: maxId, mes, categoria, tipo: 'Entrada', valor: null,
                valorCheio: ENTRADAS_CONSISTENTES[categoria] || null,
                status: 'Pendente', nota: 'Pendente', data: null,
              });
            }
            existentes.add(mes + '|' + categoria);
          }
        });
      });

      const next = [...limpos, ...novos];
      setTransacoes(next);
      try {
        await window.storage.set('transacoes_financas2026', JSON.stringify(next), false);
        await window.storage.set('auto_lancamentos_v15', 'true', false);
      } catch (e) { setStorageOk(false); }
    })();
  }, [transacoes === null]);

  async function persist(next) {
    setTransacoes(next);
    try {
      await window.storage.set('transacoes_financas2026', JSON.stringify(next), false);
    } catch (e) {
      setStorageOk(false);
    }
  }

  // "backup semanal" — em vez de baixar sozinho sem avisar (que alguns navegadores bloqueiam,
  // por tratar como download automático suspeito), o painel só AVISA que já passou uma semana
  // e mostra um botão fixo pra você confirmar com um toque. Mais transparente e sem bloqueio.
  const [backupPendente, setBackupPendente] = useState(false);
  useEffect(() => {
    if (!transacoes || transacoes.length === 0) return;
    const UMA_SEMANA_MS = 7 * 24 * 60 * 60 * 1000;
    const ultimoStr = localStorage.getItem('painel_ultimoBackupAuto');
    const ultimo = ultimoStr ? new Date(ultimoStr).getTime() : 0;
    if (Date.now() - ultimo >= UMA_SEMANA_MS) {
      setBackupPendente(true);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [transacoes != null]);

  function confirmarBackupSemanal() {
    exportarBackup();
    localStorage.setItem('painel_ultimoBackupAuto', new Date().toISOString());
    setBackupPendente(false);
  }

  function exportarBackup() {
    if (!transacoes) return;
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transacoes, null, 2));
    const downloadAnchor = document.createElement('a');
    const dataHoje = new Date().toISOString().slice(0, 10);
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `backup_financeiro_tempo_de_brincar_${dataHoje}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  // gera um arquivo .csv com todos os lançamentos, pra abrir direto no Excel/Google Sheets
  function exportarCSV() {
    if (!transacoes) return;
    const colunas = ['Mês', 'Categoria', 'Tipo', 'Valor', 'Status', 'Data', 'Banco', 'Pai/Responsável', 'Convênio'];
    const linhas = [colunas.join(';')];
    const escapar = (v) => {
      if (v == null) return '';
      const s = String(v).replace(/"/g, '""');
      return s.includes(';') || s.includes('"') || s.includes('\n') ? `"${s}"` : s;
    };
    [...transacoes].sort((a, b) => monthIndex(a.mes) - monthIndex(b.mes)).forEach(t => {
      linhas.push([
        t.mes, t.categoria, t.tipo,
        (t.valor != null ? String(t.valor).replace('.', ',') : ''),
        t.status || '', t.data || '', t.banco || '', t.pai || '', t.convenio || '',
      ].map(escapar).join(';'));
    });
    const csvContent = '\uFEFF' + linhas.join('\r\n'); // BOM no início evita acento quebrado no Excel
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const downloadAnchor = document.createElement('a');
    const dataHoje = new Date().toISOString().slice(0, 10);
    downloadAnchor.setAttribute('href', url);
    downloadAnchor.setAttribute('download', `lancamentos_tempo_de_brincar_${dataHoje}.csv`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
    URL.revokeObjectURL(url);
  }

  // gera um relatório em PDF do mês mais recente (resumo + comparação visual + gastos por categoria),
  // pronto pra imprimir ou mandar pro contador
  function exportarPDF(mesEscolhido) {
    if (!transacoes || !window.jspdf) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    const mes = mesEscolhido || [...MESES].reverse().find(m => transacoes.some(t => t.mes === m && t.status === 'Pago')) || 'AGOSTO';
    const nomeMes = mes.charAt(0) + mes.slice(1).toLowerCase();

    const doMes = transacoes.filter(t => t.mes === mes && t.status === 'Pago');
    const entradas = doMes.filter(t => t.tipo === 'Entrada').reduce((s, t) => s + (t.valor || 0), 0);
    const saidas = doMes.filter(t => t.tipo !== 'Entrada').reduce((s, t) => s + (t.valor || 0), 0);
    const resultado = entradas - saidas;
    const saldo = (saldosMensais || {})[mes] || 0;

    const porCategoria = {};
    doMes.filter(t => t.tipo !== 'Entrada').forEach(t => {
      porCategoria[t.categoria] = (porCategoria[t.categoria] || 0) + (t.valor || 0);
    });
    const categoriasOrdenadas = Object.entries(porCategoria).sort((a, b) => b[1] - a[1]);

    const roxo = [101, 27, 88];
    const roxoClaro = [138, 92, 129];
    const dourado = [184, 92, 163];
    const verde = [46, 140, 137];
    const vermelho = [193, 39, 45];
    const linhaCor = [232, 217, 229];
    const fundoClaro = [243, 233, 241];

    let y = 48;
    // logo real é 700x344 (proporção ~2,03:1) — usa a proporção certa pra não distorcer
    try { doc.addImage(LOGO_B64, 'PNG', 35, y - 16, 108, 53); } catch (e) {}
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(...roxo);
    doc.text('Escola Infantil Tempo de Brincar', 155, y + 6);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(...roxoClaro);
    doc.text(`Relatório Financeiro — ${nomeMes}`, 155, y + 22);
    y += 48;

    doc.setDrawColor(...roxo); doc.setLineWidth(1.3); doc.line(35, y, 560, y); doc.setLineWidth(1);
    y += 26;

    // KPIs em 4 colunas, com fundo destacado
    doc.setFillColor(...fundoClaro); doc.rect(35, y - 16, 525, 50, 'F');
    const kpisPdf = [
      ['ENTRADAS', formatBRL(entradas), verde],
      ['SAÍDAS', formatBRL(saidas), vermelho],
      ['RESULTADO', formatBRL(resultado), resultado >= 0 ? verde : vermelho],
      ['SALDO EM CONTA', formatBRL(saldo), roxo],
    ];
    const largCol = (560 - 35) / 4;
    kpisPdf.forEach(([label, valor, cor], i) => {
      const x = 45 + i * largCol;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...roxoClaro);
      doc.text(label, x, y);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...cor);
      doc.text(valor, x, y + 18);
    });
    y += 50;

    // comparação visual simples (barras) Entradas x Saídas
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...roxo);
    doc.text('Entradas x Saídas', 35, y);
    y += 14;
    const maiorValor = Math.max(entradas, saidas, 1);
    const largMax = 380;
    const largEntrada = (entradas / maiorValor) * largMax;
    const largSaida = (saidas / maiorValor) * largMax;
    doc.setFillColor(...verde); doc.rect(35, y, largEntrada, 16, 'F');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...roxo);
    doc.text(`Entradas — ${formatBRL(entradas)}`, 35 + largMax + 10, y + 12);
    y += 24;
    doc.setFillColor(...vermelho); doc.rect(35, y, largSaida, 16, 'F');
    doc.text(`Saídas — ${formatBRL(saidas)}`, 35 + largMax + 10, y + 12);
    y += 36;
    doc.setDrawColor(...linhaCor); doc.line(35, y, 560, y);
    y += 26;

    // tabela de despesas por categoria
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...roxo);
    doc.text('Despesas por categoria', 35, y);
    y += 16;
    doc.setFillColor(...fundoClaro); doc.rect(35, y - 11, 525, 16, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...roxoClaro);
    doc.text('CATEGORIA', 40, y);
    doc.text('VALOR', 550, y, { align: 'right' });
    y += 16;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
    categoriasOrdenadas.forEach(([cat, valor], i) => {
      if (y > 790) { doc.addPage(); y = 50; }
      if (i % 2 === 1) { doc.setFillColor(250, 246, 249); doc.rect(35, y - 10, 525, 15, 'F'); }
      doc.setTextColor(...roxo);
      doc.text(cat, 40, y);
      doc.setFont('helvetica', 'bold'); doc.setTextColor(...dourado);
      doc.text(formatBRL(valor), 550, y, { align: 'right' });
      doc.setFont('helvetica', 'normal');
      y += 15;
    });

    const totalPaginas = doc.internal.getNumberOfPages();
    for (let p = 1; p <= totalPaginas; p++) {
      doc.setPage(p);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...roxoClaro);
      doc.text(`Gerado em ${new Date().toLocaleDateString('pt-BR')} pelo Painel Financeiro`, 35, 820);
    }

    const blobPdf = doc.output('blob');
    const urlPdf = URL.createObjectURL(blobPdf);
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute('href', urlPdf);
    downloadAnchor.setAttribute('download', `relatorio_${mes.toLowerCase()}_tempo_de_brincar.pdf`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
    URL.revokeObjectURL(urlPdf);
  }

  function importarBackup(e) {
    const fileReader = new FileReader();
    if (!e.target.files || e.target.files.length === 0) return;
    fileReader.readAsText(e.target.files[0], "UTF-8");
    fileReader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        if (Array.isArray(parsed) && parsed.length > 0) {
          persist(parsed);
          alert('Backup restaurado com sucesso! Todos os dados foram atualizados neste computador.');
        } else {
          alert('Arquivo de backup inválido.');
        }
      } catch (err) {
        alert('Erro ao processar o arquivo de backup.');
      }
    };
  }

  function adicionarLancamento(e) {
    e.preventDefault();
    setFormErro('');
    setFormOk(false);
    const valorNum = parseBRLInput(novoValor);
    if (!novaCategoria.trim()) { setFormErro('Escreva o nome do lançamento (ex: Mercado, Saque Sicoob).'); return; }
    if (!valorNum || valorNum <= 0) { setFormErro('Coloque um valor válido, maior que zero.'); return; }
    const maxId = transacoes.reduce((m, t) => Math.max(m, t.id), 0);
    const novo = {
      id: maxId + 1,
      mes: novoMes,
      categoria: novaCategoria.trim().toUpperCase(),
      tipo: novoTipo,
      valor: valorNum,
      status: novoStatus,
    };
    persist([...transacoes, novo]);
    setNovaCategoria('');
    setNovoValor('');
    setFormOk(true);
    setTimeout(() => setFormOk(false), 2500);
  }

  function removerLancamento(id) {
    const item = transacoes.find(t => t.id === id);
    const nome = item ? (item.categoria.replace('Mensalidade - ', '').replace('Convênio - ', '')) : 'este lançamento';
    const valorTexto = item && item.valor != null ? ` (${formatBRL(item.valor)})` : '';
    if (!window.confirm(`Tem certeza que quer excluir "${nome}"${valorTexto}?\n\nEssa ação não pode ser desfeita.`)) return;
    persist(transacoes.filter(t => t.id !== id));
  }

  function editarLancamento(id, updates) {
    persist(transacoes.map(t => t.id === id ? { ...t, ...updates } : t));
  }

  function darBaixa(id) {
    persist(transacoes.map(t => t.id === id ? { ...t, status: t.status === 'Pago' ? 'Pendente' : 'Pago' } : t));
  }

  function darNota(id) {
    persist(transacoes.map(t => t.id === id ? { ...t, nota: t.nota === 'Enviada' ? 'Pendente' : 'Enviada' } : t));
  }

  function adicionarEntrada(registro) {
    const maxId = transacoes.reduce((m, t) => Math.max(m, t.id), 0);
    persist([...transacoes, { ...registro, id: maxId + 1 }]);
  }

  const resumoMensal = useMemo(() => {
    if (!transacoes) return [];
    return MESES.map(mes => {
      const doMes = transacoes.filter(t => t.mes === mes && t.status === 'Pago');
      const entradas = doMes.filter(t => t.tipo === 'Entrada').reduce((s,t)=>s+t.valor,0);
      const fixas = doMes.filter(t => t.tipo === 'Fixa').reduce((s,t)=>s+t.valor,0);
      const variaveis = doMes.filter(t => t.tipo === 'Variável').reduce((s,t)=>s+t.valor,0);
      const saidas = fixas + variaveis;
      const lucro = entradas - saidas;
      const temDados = transacoes.some(t => t.mes === mes);
      let status = 'Sem dados';
      if (temDados && entradas > 0) status = 'OK';
      else if (temDados && entradas === 0) status = 'Falta entrada';
      return { mes, mesAbrev: MESES_ABREV[mes], entradas, fixas, variaveis, saidas, lucro, status };
    });
  }, [transacoes]);

  const kpis = useMemo(() => {
    const comDados = resumoMensal.filter(m => m.status !== 'Sem dados');
    const entradas = comDados.reduce((s,m)=>s+m.entradas,0);
    const saidas = comDados.reduce((s,m)=>s+m.saidas,0);
    const resultado = entradas - saidas;
    const saldos = saldosMensais || {};
    // usa o último mês que tem um saldo digitado (maior que zero), do mais recente pro mais antigo
    const mesComSaldo = [...MESES].reverse().find(m => saldos[m] > 0);
    return { entradas, saidas, resultado, saldo: mesComSaldo ? saldos[mesComSaldo] : 0, mesSaldo: mesComSaldo ? MESES_ABREV[mesComSaldo] : '-' };
  }, [resumoMensal, saldosMensais]);

  const top10 = useMemo(() => {
    if (!transacoes) return [];
    const porCategoria = {};
    transacoes.filter(t => t.tipo !== 'Entrada' && t.status === 'Pago').forEach(t => {
      porCategoria[t.categoria] = (porCategoria[t.categoria] || 0) + (t.valor || 0);
    });
    return Object.entries(porCategoria)
      .map(([categoria, total]) => ({ categoria, total }))
      .sort((a,b) => b.total - a.total)
      .slice(0, 10)
      .reverse();
  }, [transacoes]);

  const fixasVsVariaveis = useMemo(() => {
    const comDados = resumoMensal.filter(m => m.status !== 'Sem dados');
    const fixas = comDados.reduce((s,m)=>s+m.fixas,0);
    const variaveis = comDados.reduce((s,m)=>s+m.variaveis,0);
    return [{ name: 'Fixas', value: fixas }, { name: 'Variáveis', value: variaveis }];
  }, [resumoMensal]);

  const saldoEvolucao = useMemo(() => {
    const saldos = saldosMensais || {};
    return MESES.map(m => ({ mes: MESES_ABREV[m], total: saldos[m] || 0 }));
  }, [saldosMensais]);

  const alertas = useMemo(() => {
    const lista = [];
    const semEntrada = resumoMensal.filter(m => m.status === 'Falta entrada').map(m => m.mesAbrev);
    if (semEntrada.length) lista.push(`${semEntrada.join(', ')} ainda ${semEntrada.length > 1 ? 'estão' : 'está'} sem valor de entrada lançado — o resultado pode parecer bem negativo por causa disso, não é prejuízo de verdade.`);
    const semDados = resumoMensal.filter(m => m.status === 'Sem dados').map(m => m.mesAbrev);
    if (semDados.length) lista.push(`${semDados.join(', ')} ainda não têm nenhum lançamento.`);
    if (Object.keys(FIXAS_CONSISTENTES).length) lista.push('As contas fixas que se repetem todo mês (aluguel, salário, internet, etc.) já ficaram lembradas nos próximos meses em linha única — clique no lápis ✎ ao lado de cada uma na aba Lançamentos para somar ou preencher.');
    return lista;
  }, [resumoMensal]);

  const transacoesFiltradas = useMemo(() => {
    if (!transacoes) return [];
    return transacoes
      .filter(t => t.tipo !== 'Entrada')
      .filter(t => filtroMes === 'TODOS' || t.mes === filtroMes)
      .filter(t => {
        if (!filtroTexto) return true;
        const busca = filtroTexto.toLowerCase().trim();
        if (t.categoria.toLowerCase().includes(busca)) return true;
        // também aceita buscar pelo valor, digitado com ou sem vírgula/ponto (ex: "1500" acha "R$ 1.500,00")
        const buscaNum = busca.replace(/\./g, '').replace(',', '.');
        if (buscaNum && !isNaN(buscaNum) && t.valor != null) {
          return String(t.valor).includes(buscaNum) || formatBRLNumber(t.valor).replace(/\./g, '').includes(busca.replace(/\./g, ''));
        }
        return false;
      })
      .sort((a,b) => monthIndex(a.mes) - monthIndex(b.mes) || a.categoria.localeCompare(b.categoria));
  }, [transacoes, filtroMes, filtroTexto]);

  const agrupadoPorMes = useMemo(() => {
    const grupos = {};
    transacoesFiltradas.forEach(t => {
      if (!grupos[t.mes]) grupos[t.mes] = [];
      grupos[t.mes].push(t);
    });
    return MESES.filter(m => grupos[m]).map(m => ({ mes: m, itens: grupos[m] }));
  }, [transacoesFiltradas]);

  function toggleMes(mes) {
    setMesesAbertos(prev => {
      const atualmenteAberto = prev[mes] === true;
      return atualmenteAberto ? {} : { [mes]: true };
    });
  }

  if (loading || pinConfigurado === null) {
    return (
      <div style={{ background: COLORS.paper, minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Inter, sans-serif', color: COLORS.ink }}>
        Carregando painel...
      </div>
    );
  }

  if (!desbloqueado && (pinConfigurado || pinConfigurado === '')) {
    // se ainda não configurou PIN nenhum (string vazia), oferece criar; se já tem, pede pra digitar
    return (
      <TelaBloqueio
        pinConfigurado={pinConfigurado}
        onDesbloquear={() => setDesbloqueado(true)}
        onDefinirPin={definirPin}
        onRemoverPin={removerPin}
      />
    );
  }

  return (
    <div className={`painel-raiz${temaEscuro ? ' dark-mode' : ''}`} style={{ background: COLORS.paper, minHeight: '100vh', fontFamily: 'Inter, -apple-system, sans-serif', color: COLORS.ink, zoom: 0.92, paddingTop: backupPendente ? 38 : 0 }}>
      {backupPendente && (
        <button onClick={confirmarBackupSemanal} style={{
          position: 'fixed', top: 0, left: 0, right: 0, zIndex: 9998, width: '100%',
          background: COLORS.inkButton, color: '#FFFFFF', border: 'none', cursor: 'pointer',
          padding: '10px 16px', fontSize: 13, fontWeight: 600,
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
        }}>
          💾 Seu backup semanal está pronto — toque aqui pra baixar
        </button>
      )}
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        /* o "zoom" e uma propriedade nao-padrao que se comporta de forma inconsistente
           em tablets (principalmente Safari/iPad) — em telas de tablet e celular, o
           layout ja e responsivo por conta propria, entao desligamos o zoom ali e deixamos
           os proprios grids/flex se ajustarem, evitando texto/elementos desproporcionais */
        @media (max-width: 1180px) {
          .painel-raiz { zoom: 1 !important; }
          .painel-main { padding: 16px 14px 40px !important; }
          /* formulario de novo lancamento: em vez de varios campos espremidos numa linha só,
             quebra em 2 colunas — mais confortavel de tocar num tablet */
          .grid-form-lanc { grid-template-columns: repeat(2, 1fr) !important; }
          /* graficos: forca 1 por linha em vez de deixar 1 sobrando esticado/vazio */
          .grid-charts-a, .grid-charts-b { grid-template-columns: 1fr !important; }
        }
        /* tablets de 7-8 polegadas (ex: iPad Mini, Galaxy Tab A) — telas bem mais estreitas,
           aperta ainda mais os espaçamentos e deixa o cabeçalho empilhar se precisar */
        @media (max-width: 834px) {
          .painel-main { padding: 10px 8px 30px !important; }
          .painel-main table td, .painel-main table th { padding: 6px 7px !important; font-size: 11px !important; }
          .grid-form-lanc { grid-template-columns: 1fr !important; }
          .grid-kpi { grid-template-columns: repeat(2, 1fr) !important; }
        }
        @media (max-width: 600px) {
          .painel-main { padding: 8px 6px 24px !important; }
        }
        .serif { font-family: 'Baloo 2', 'Inter', sans-serif; }
        .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
        .ledger-lines {
          background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, ${COLORS.line} 28px);
        }
        input, select { outline: none; }
        input:focus, select:focus { border-color: ${COLORS.gold} !important; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: ${COLORS.line}; border-radius: 4px; }
      `}</style>

      {/* HEADER COM LOGO VETORIAL DA ESCOLA */}
                              <header style={{ background: '#FFFFFF', padding: '14px 24px 0', borderBottom: `1px solid ${COLORS.line}`, boxShadow: '0 2px 6px rgba(101,27,88,0.06)' }}>
        <div style={{ maxWidth: 1600, margin: '0 auto' }}>
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 5 }}>
            <img src={LOGO_B64} alt="Escola Infantil Tempo de Brincar" style={{ height: 96, maxWidth: '100%', objectFit: 'contain', flexShrink: 0 }} />

            {/* BOTÕES DE BACKUP / SINCRONIZAÇÃO ENTRE COMPUTADORES */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
              <button
                onClick={exportarBackup}
                title="Baixa um arquivo com todos os seus lançamentos para você abrir em outro computador"
                style={{
                  background: '#FFFDF8',
                  border: `1.5px solid ${COLORS.gold}`,
                  borderRadius: 8,
                  padding: '6px 13px',
                  fontSize: 12,
                  fontWeight: 700,
                  color: COLORS.ink,
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: 7,
                  boxShadow: '0 1px 3px rgba(0,0,0,0.06)',
                }}
              >
                📥 Backup
              </button>
              <label
                title="Carrega os dados de um arquivo de backup salvo de outro computador"
                style={{
                  background: '#FFFDF8',
                  border: `1.5px solid ${COLORS.green}`,
                  borderRadius: 8,
                  padding: '6px 13px',
                  fontSize: 12,
                  fontWeight: 700,
                  color: COLORS.green,
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: 7,
                  boxShadow: '0 1px 3px rgba(0,0,0,0.06)',
                }}
              >
                📤 Carregar
                <input type="file" accept=".json" onChange={importarBackup} style={{ display: 'none' }} />
              </label>
              <button
                onClick={exportarCSV}
                title="Baixa todos os lançamentos num arquivo .csv, pra abrir no Excel ou Google Sheets"
                style={{
                  background: '#FFFDF8',
                  border: `1.5px solid ${COLORS.line}`,
                  borderRadius: 8,
                  padding: '6px 13px',
                  fontSize: 12,
                  fontWeight: 700,
                  color: COLORS.ink,
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: 7,
                  boxShadow: '0 1px 3px rgba(0,0,0,0.06)',
                }}
              >
                📊 Exportar CSV
              </button>
              <button
                onClick={() => exportarPDF()}
                title="Gera um relatório em PDF do mês mais recente, pronto pra imprimir ou mandar pro contador"
                style={{
                  background: '#FFFDF8',
                  border: `1.5px solid ${COLORS.line}`,
                  borderRadius: 8,
                  padding: '6px 13px',
                  fontSize: 12,
                  fontWeight: 700,
                  color: COLORS.ink,
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: 7,
                  boxShadow: '0 1px 3px rgba(0,0,0,0.06)',
                }}
              >
                📄 Exportar PDF
              </button>
              <button
                onClick={() => setTemaEscuro(v => !v)}
                title="Alternar entre tema claro e escuro"
                style={{
                  background: '#FFFDF8',
                  border: `1.5px solid ${COLORS.line}`,
                  borderRadius: 8,
                  padding: '6px 13px',
                  fontSize: 12,
                  fontWeight: 700,
                  color: COLORS.ink,
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: 7,
                  boxShadow: '0 1px 3px rgba(0,0,0,0.06)',
                }}
              >
                {temaEscuro ? '☀️ Modo claro' : '🌙 Modo escuro'}
              </button>
            </div>
          </div>

          <div className="mono" style={{ color: COLORS.red, fontSize: 11, marginTop: 3 }}>
            {!storageOk && <span>⚠ sem conexão com o armazenamento — alterações não vão salvar</span>}
          </div>
          {statusPlanilha && (
            <div className="mono" style={{ fontSize: 10.5, marginTop: 3, color: statusPlanilha === 'ok' ? COLORS.green : COLORS.gold }}>
              {statusPlanilha === 'ok' ? '🔄 sincronizado com a Planilha Google' : '⚠ não sincronizou agora — salvo só neste navegador'}
            </div>
          )}

          <div style={{ display: 'flex', justifyContent: 'center' }}>
            {/* TABS */}
            <div style={{ display: 'flex', gap: 4, marginTop: 2 }}>
              {[['visao','Visão geral'],['lancamentos','Lançamentos'],['mensalidades','Mensalidades'],['orcamento','Orçamento'],['compras','Compras'],['valores','Valores']].map(([key,label]) => (
                <button key={key} onClick={() => setTab(key)}
                  style={{
                    padding: '9px 18px', borderRadius: '8px 8px 0 0', border: 'none', cursor: 'pointer',
                    fontFamily: 'Inter, sans-serif', fontWeight: 600, fontSize: 14,
                    background: tab === key ? COLORS.ink : 'transparent',
                    color: tab === key ? '#FFFFFF' : COLORS.inkSoft,
                  }}>{label}</button>
              ))}
            </div>
          </div>
        </div>
      </header>

      <main className="painel-main" style={{ maxWidth: 1600, margin: '0 auto', padding: '24px 24px 60px' }}>
        {/* KPI STRIP (só na Visão Geral) */}
        {tab === 'visao' && (
          <div className="ledger-lines" style={{ marginBottom: 24, padding: '4px 0' }}>
            <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 8 }}>
              <button onClick={() => setModoPrivado(v => !v)} title={modoPrivado ? 'Mostrar valores' : 'Esconder valores'} style={{
                background: 'none', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 5,
                color: COLORS.inkSoft, fontSize: 11.5, fontWeight: 600,
              }}>
                {modoPrivado ? <EyeOff size={15} /> : <Eye size={15} />}
                {modoPrivado ? 'Valores ocultos' : 'Ocultar valores'}
              </button>
            </div>
            <KPIStrip oculto={modoPrivado} items={[
              { label: 'Entradas (com dados)', valor: kpis.entradas, icon: TrendingUp, cor: COLORS.green, bg: COLORS.greenBg },
              { label: 'Saídas (com dados)', valor: kpis.saidas, icon: TrendingDown, cor: COLORS.red, bg: COLORS.redBg },
              { label: 'Resultado', valor: kpis.resultado, icon: kpis.resultado >= 0 ? TrendingUp : TrendingDown, cor: kpis.resultado >= 0 ? COLORS.green : COLORS.red, bg: kpis.resultado >= 0 ? COLORS.greenBg : COLORS.redBg },
            ]} />
          </div>
        )}


        {tab === 'visao' ? (
          <VisaoGeral
            resumoMensal={resumoMensal}
            top10={top10}
            fixasVsVariaveis={fixasVsVariaveis}
            saldoEvolucao={saldoEvolucao}
            transacoes={transacoes}
            saldosMensais={saldosMensais}
            salvarSaldoMensal={salvarSaldoMensal}
            modoPrivado={modoPrivado} setModoPrivado={setModoPrivado}
          />
        ) : tab === 'lancamentos' ? (
          <Lancamentos
            transacoes={transacoes} agrupadoPorMes={agrupadoPorMes}
            filtroMes={filtroMes} setFiltroMes={setFiltroMes}
            filtroTexto={filtroTexto} setFiltroTexto={setFiltroTexto}
            mesesAbertos={mesesAbertos} toggleMes={toggleMes}
            removerLancamento={removerLancamento}
            editarLancamento={editarLancamento}
            novoMes={novoMes} setNovoMes={setNovoMes}
            novaCategoria={novaCategoria} setNovaCategoria={setNovaCategoria}
            novoTipo={novoTipo} setNovoTipo={setNovoTipo}
            novoValor={novoValor} setNovoValor={setNovoValor}
            novoStatus={novoStatus} setNovoStatus={setNovoStatus}
            adicionarLancamento={adicionarLancamento}
            formErro={formErro} formOk={formOk}
            saldosMensais={saldosMensais}
            salvarSaldoMensal={salvarSaldoMensal}
            privadoTotais={privadoTotais} setPrivadoTotais={setPrivadoTotais}
            privadoDetalhes={privadoDetalhes} setPrivadoDetalhes={setPrivadoDetalhes}
          />
        ) : tab === 'mensalidades' ? (
          <Mensalidades
            transacoes={transacoes}
            darBaixa={darBaixa}
            darNota={darNota}
            editarLancamento={editarLancamento}
            removerLancamento={removerLancamento}
            adicionarEntrada={adicionarEntrada}
            privadoTotais={privadoTotais} setPrivadoTotais={setPrivadoTotais}
            privadoDetalhes={privadoDetalhes} setPrivadoDetalhes={setPrivadoDetalhes}
          />
        ) : tab === 'orcamento' ? (
          <Orcamento transacoes={transacoes} modoPrivado={modoPrivado} setModoPrivado={setModoPrivado} />
        ) : tab === 'compras' ? (
          <Compras />
        ) : (
          <Valores modoPrivado={modoPrivado} setModoPrivado={setModoPrivado} />
        )}
      </main>
    </div>
  );
}

function KPIStrip({ items, extra, oculto }) {
  return (
    <div className="grid-kpi" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 16 }}>
      {items.map((c, i) => (
        <div key={i} style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: '14px 16px', boxShadow: '0 1px 2px rgba(31,59,54,0.06)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
            <div style={{ background: c.bg, borderRadius: 6, padding: 5, display: 'flex' }}>
              <c.icon size={13} color={c.cor} />
            </div>
            <span style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600, letterSpacing: '0.03em', textTransform: 'uppercase' }}>{c.label}</span>
          </div>
          <div className="mono" style={{ fontSize: 20, fontWeight: 600, color: c.cor }}>{formatBRLPrivado(c.valor, oculto)}</div>
        </div>
      ))}
      {extra}
    </div>
  );
}

function CardChart({ title, children, height = 200, rightHeader }) {
  return (
    <div style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: '14px 16px', boxShadow: '0 1px 2px rgba(31,59,54,0.06)', display: 'flex', flexDirection: 'column' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10, gap: 8, flexWrap: 'wrap' }}>
        <h3 className="serif" style={{ fontSize: 14.5, fontWeight: 600, color: COLORS.ink, margin: 0 }}>{title}</h3>

const CustomTooltip = ({ active, payload, label }) => {
  if (!active || !payload || !payload.length) return null;
  return (
    <div style={{ background: COLORS.inkButton, color: '#FFFDF8', padding: '7px 11px', borderRadius: 6, fontSize: 12 }} className="mono">
      <div style={{ marginBottom: 3, opacity: 0.75 }}>{label}</div>
      {payload.map((p, i) => (
        <div key={i} style={{ color: p.color || '#FFF' }}>{p.name}: {formatBRL(p.value)}</div>
      ))}
    </div>
  );
};

function VisaoGeral({ resumoMensal, top10, fixasVsVariaveis, saldoEvolucao, transacoes, saldosMensais, salvarSaldoMensal, modoPrivado, setModoPrivado }) {
  const [editandoSaldos, setEditandoSaldos] = useState(true);
  const [saldoEditMes, setSaldoEditMes] = useState(null);
  const [saldoEditValor, setSaldoEditValor] = useState('');

  function iniciarEdicaoSaldo(mes) {
    setSaldoEditMes(mes);
    setSaldoEditValor(formatBRLNumber((saldosMensais || {})[mes] || 0));
  }
  function salvarEdicaoSaldo() {
    const num = parseBRLInput(saldoEditValor);
    if (num != null && salvarSaldoMensal) salvarSaldoMensal(saldoEditMes, num);
    setSaldoEditMes(null);
  }

  // detecta despesas "fixas" que se repetem quase todo mês (tipo aluguel, água, internet)
  // e avisa se alguma delas ainda não foi lançada no mês mais recente
  const alertaFixasFaltando = useMemo(() => {
    if (!transacoes) return null;
    const mesesComDados = MESES.filter(m => transacoes.some(t => t.mes === m));
    if (mesesComDados.length < 3) return null; // precisa de histórico mínimo pra não dar falso alarme
    const mesAtual = mesesComDados[mesesComDados.length - 1];
    const mesesAnteriores = mesesComDados.slice(0, -1);
    const contagem = {};
    mesesAnteriores.forEach(mes => {
      const categoriasNoMes = new Set(transacoes.filter(t => t.mes === mes && t.tipo === 'Fixa').map(t => t.categoria));
      categoriasNoMes.forEach(cat => { contagem[cat] = (contagem[cat] || 0) + 1; });
    });
    const limiar = Math.max(2, Math.ceil(mesesAnteriores.length * 0.7));
    const recorrentes = Object.keys(contagem).filter(cat => contagem[cat] >= limiar);
    const categoriasDoMesAtual = new Set(transacoes.filter(t => t.mes === mesAtual).map(t => t.categoria));
    const faltando = recorrentes.filter(cat => !categoriasDoMesAtual.has(cat)).sort();
    if (faltando.length === 0) return null;
    return { mes: mesAtual, categorias: faltando };
  }, [transacoes]);

  const inadimplencia = useMemo(() => {
    if (!transacoes) return null;
    const mesAlvo = [...MESES].reverse().find(m => transacoes.some(t => t.mes === m && t.tipo === 'Entrada' && t.status === 'Pago'));
    if (!mesAlvo) return null;
    const pendentes = transacoes.filter(t => t.mes === mesAlvo && t.categoria.startsWith('Mensalidade - ') && t.status === 'Pendente');
    const totalAlunos = transacoes.filter(t => t.mes === mesAlvo && t.categoria.startsWith('Mensalidade - ')).length;
    return {
      mes: mesAlvo,
      qtd: pendentes.length,
      valor: pendentes.reduce((s, t) => s + (t.valor || 0), 0),
      totalAlunos,
      nomes: pendentes.map(t => t.categoria.replace('Mensalidade - ', '')),
    };
  }, [transacoes]);

  const categoriasDespesa = useMemo(() => {
    if (!transacoes) return [];
    const set = new Set();
    transacoes.filter(t => t.tipo !== 'Entrada').forEach(t => {
      if (t.categoria) set.add(t.categoria);
    });
    return Array.from(set).sort();
  }, [transacoes]);

  const [categoriaSelecionada, setCategoriaSelecionada] = useState(
    categoriasDespesa.includes('STOCK CENTER') ? 'STOCK CENTER' : (categoriasDespesa[0] || 'ALUGUEL')
  );

  const evolucaoCategoria = useMemo(() => {
    if (!transacoes || !categoriaSelecionada) return [];
    return MESES.map(mes => {
      const doMes = transacoes.filter(t => t.mes === mes && t.categoria === categoriaSelecionada && t.tipo !== 'Entrada');
      const total = doMes.reduce((s, t) => s + (t.valor || 0), 0);
      return { mesAbrev: MESES_ABREV[mes], mesNome: mes, total };
    });
  }, [transacoes, categoriaSelecionada]);

  const statsCategoria = useMemo(() => {
    const comValor = evolucaoCategoria.filter(e => e.total > 0);
    const totalAno = evolucaoCategoria.reduce((s, e) => s + e.total, 0);
    const media = comValor.length > 0 ? totalAno / comValor.length : 0;
    const maxItem = evolucaoCategoria.reduce((max, e) => e.total > max.total ? e : max, { mesAbrev: '—', total: 0 });
    return { totalAno, media, maxItem, mesesComGasto: comValor.length };
  }, [evolucaoCategoria]);

  return (
    <div style={{ display: 'grid', gap: 18 }}>
      {inadimplencia && inadimplencia.qtd > 0 && (
        <div style={{
          background: COLORS.redBg, border: `1.5px solid ${COLORS.red}55`, borderRadius: 10,
          padding: '14px 18px', display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap',
        }}>
          <AlertTriangle size={20} color={COLORS.red} style={{ flexShrink: 0 }} />
          <div style={{ flex: '1 1 auto' }}>
            <span style={{ fontWeight: 700, color: COLORS.red, fontSize: 14 }}>
              {inadimplencia.qtd} de {inadimplencia.totalAlunos} famílias com mensalidade em aberto em {inadimplencia.mes.charAt(0) + inadimplencia.mes.slice(1).toLowerCase()}
            </span>
            <span style={{ color: COLORS.inkSoft, fontSize: 12.5, marginLeft: 8 }}>
              — {formatBRLPrivado(inadimplencia.valor, modoPrivado)} pendente · {inadimplencia.nomes.slice(0, 3).join(', ')}{inadimplencia.nomes.length > 3 ? ` +${inadimplencia.nomes.length - 3}` : ''}
            </span>
          </div>
        </div>
      )}

      {alertaFixasFaltando && (
        <div style={{
          background: COLORS.goldSoft, border: `1.5px solid ${COLORS.gold}55`, borderRadius: 10,
          padding: '14px 18px', display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap',
        }}>
          <AlertTriangle size={20} color={COLORS.gold} style={{ flexShrink: 0 }} />
          <div style={{ flex: '1 1 auto' }}>
            <span style={{ fontWeight: 700, color: COLORS.ink, fontSize: 14 }}>
              {alertaFixasFaltando.categorias.length === 1 ? 'Uma despesa fixa' : `${alertaFixasFaltando.categorias.length} despesas fixas`} ainda não {alertaFixasFaltando.categorias.length === 1 ? 'foi lançada' : 'foram lançadas'} em {alertaFixasFaltando.mes.charAt(0) + alertaFixasFaltando.mes.slice(1).toLowerCase()}
            </span>
            <span style={{ color: COLORS.inkSoft, fontSize: 12.5, marginLeft: 8 }}>
              — {alertaFixasFaltando.categorias.join(', ')}
            </span>
          </div>
        </div>
      )}

      {/* EDIÇÃO MANUAL DO SALDO MENSAL — o saldo não dá pra calcular sozinho a partir dos
          lançamentos (não bate com o extrato real), então fica editável aqui, mês a mês */}
      <div style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: 'hidden' }}>
        <button onClick={() => setEditandoSaldos(v => !v)} style={{
          width: '100%', display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          padding: '11px 18px', background: COLORS.lineSoft, border: 'none', cursor: 'pointer',
          fontSize: 12.5, fontWeight: 700, color: COLORS.ink,
        }}>
          <span>💰 Editar saldo em conta de cada mês (confira no extrato do banco)</span>
          <ChevronDown size={16} style={{ transform: editandoSaldos ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s' }} />
        </button>
        {editandoSaldos && (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 1, background: COLORS.lineSoft }}>
            {MESES.map(mes => {
              const emEdicao = saldoEditMes === mes;
              const valorAtual = (saldosMensais || {})[mes] || 0;
              return (
                <div key={mes} style={{ background: COLORS.paperCard, padding: '10px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 12.5, color: COLORS.inkSoft, fontWeight: 600 }}>{MESES_ABREV[mes]}</span>
                  {emEdicao ? (
                    <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                      <input autoFocus value={saldoEditValor} onChange={e => setSaldoEditValor(e.target.value)}
                        onKeyDown={e => { if (e.key === 'Enter') salvarEdicaoSaldo(); if (e.key === 'Escape') setSaldoEditMes(null); }}
                        className="mono" style={{ width: 90, border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: '4px 6px', fontSize: 12.5 }} />
                      <button onClick={salvarEdicaoSaldo} style={{ background: COLORS.green, border: 'none', borderRadius: 5, padding: '4px 6px', cursor: 'pointer' }}>
                        <Check size={12} color="#FFFFFF" />
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => iniciarEdicaoSaldo(mes)} style={{ background: 'none', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6 }}>
                      <span className="mono" style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.ink }}>{formatBRLPrivado(valorAtual, modoPrivado)}</span>
                      <Pencil size={11} color={COLORS.inkSoft} />
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="grid-charts-a" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16 }}>
        <CardChart title="Entradas x Saídas" height={180}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={resumoMensal} margin={{ top: 2, right: 2, left: -22, bottom: 0 }}>
              <CartesianGrid stroke={COLORS.lineSoft} vertical={false} />
              <XAxis dataKey="mesAbrev" tick={{ fontSize: 10, fill: COLORS.inkSoft }} axisLine={{ stroke: COLORS.line }} tickLine={false} />
              <YAxis tick={{ fontSize: 9.5, fill: COLORS.inkSoft }} tickFormatter={formatBRLShort} axisLine={false} tickLine={false} />
              <Tooltip content={<CustomTooltip />} cursor={{ fill: COLORS.lineSoft }} />
              <Legend wrapperStyle={{ fontSize: 11, paddingTop: 4 }} />
              <Bar dataKey="entradas" name="Entradas" fill={COLORS.green} radius={[2,2,0,0]} isAnimationActive={false} />
              <Bar dataKey="saidas" name="Saídas" fill={COLORS.red} radius={[2,2,0,0]} isAnimationActive={false} />
            </BarChart>
          </ResponsiveContainer>
        </CardChart>

        <CardChart title="Lucro Mensal" height={180}>
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={resumoMensal} margin={{ top: 4, right: 6, left: -22, bottom: 0 }}>
              <CartesianGrid stroke={COLORS.lineSoft} vertical={false} />
              <XAxis dataKey="mesAbrev" tick={{ fontSize: 10, fill: COLORS.inkSoft }} axisLine={{ stroke: COLORS.line }} tickLine={false} />
              <YAxis tick={{ fontSize: 9.5, fill: COLORS.inkSoft }} tickFormatter={formatBRLShort} axisLine={false} tickLine={false} />
              <Tooltip content={<CustomTooltip />} />
              <Line type="monotone" dataKey="lucro" name="Lucro" stroke={COLORS.gold} strokeWidth={2} dot={{ r: 2.5, fill: COLORS.gold }} isAnimationActive={false} />
            </LineChart>
          </ResponsiveContainer>
        </CardChart>

        <CardChart title="Evolução do Saldo em Conta" height={180}>
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={saldoEvolucao} margin={{ top: 4, right: 6, left: -22, bottom: 0 }}>
              <CartesianGrid stroke={COLORS.lineSoft} vertical={false} />
              <XAxis dataKey="mes" tick={{ fontSize: 10, fill: COLORS.inkSoft }} axisLine={{ stroke: COLORS.line }} tickLine={false} />
              <YAxis tick={{ fontSize: 9.5, fill: COLORS.inkSoft }} tickFormatter={formatBRLShort} axisLine={false} tickLine={false} />
              <Tooltip content={<CustomTooltip />} />
              <Line type="monotone" dataKey="total" name="Saldo" stroke={COLORS.ink} strokeWidth={2} dot={{ r: 2.5, fill: COLORS.ink }} isAnimationActive={false} />
            </LineChart>
          </ResponsiveContainer>
        </CardChart>
      </div>

            <div className="grid-charts-b" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: 16 }}>
        <CardChart
          title="Raio-X de Gastos por Item"
          height={210}
          rightHeader={
            <select
              value={categoriaSelecionada}
              onChange={e => setCategoriaSelecionada(e.target.value)}
              style={{
                border: `1px solid ${COLORS.gold}`,
                borderRadius: 6,
                padding: '4px 8px',
                fontSize: 11.5,
                fontWeight: 700,
                color: COLORS.ink,
                background: '#FFFDF8',
                cursor: 'pointer',
                maxWidth: 180,
              }}
            >
              {categoriasDespesa.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          }
        >
          <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
            <div style={{ display: 'flex', gap: 8, marginBottom: 8, flexWrap: 'wrap' }}>
              <div style={{ background: COLORS.goldSoft, borderRadius: 5, padding: '3px 7px', fontSize: 11 }}>
                <span style={{ color: COLORS.inkSoft }}>Total no ano: </span>
                <span className="mono" style={{ fontWeight: 700, color: COLORS.ink }}>{formatBRLPrivado(statsCategoria.totalAno, modoPrivado)}</span>
              </div>
              <div style={{ background: COLORS.lineSoft, borderRadius: 5, padding: '3px 7px', fontSize: 11 }}>
                <span style={{ color: COLORS.inkSoft }}>Média/mês: </span>
                <span className="mono" style={{ fontWeight: 700, color: COLORS.ink }}>{formatBRLPrivado(statsCategoria.media, modoPrivado)}</span>
              </div>
              {statsCategoria.maxItem.total > 0 && (
                <div style={{ background: COLORS.redBg, borderRadius: 5, padding: '3px 7px', fontSize: 11 }}>
                  <span style={{ color: COLORS.red }}>Pico ({statsCategoria.maxItem.mesAbrev}): </span>
                  <span className="mono" style={{ fontWeight: 700, color: COLORS.red }}>{formatBRLPrivado(statsCategoria.maxItem.total, modoPrivado)}</span>
                </div>
              )}
            </div>

            <div style={{ flexGrow: 1, minHeight: 140 }}>
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={evolucaoCategoria} margin={{ top: 2, right: 4, left: -20, bottom: 0 }}>
                  <CartesianGrid stroke={COLORS.lineSoft} vertical={false} />
                  <XAxis dataKey="mesAbrev" tick={{ fontSize: 10, fill: COLORS.inkSoft }} axisLine={{ stroke: COLORS.line }} tickLine={false} />
                  <YAxis tick={{ fontSize: 9.5, fill: COLORS.inkSoft }} tickFormatter={formatBRLShort} axisLine={false} tickLine={false} />
                  <Tooltip content={<CustomTooltip />} cursor={{ fill: COLORS.lineSoft }} />
                  <Bar dataKey="total" name={categoriaSelecionada} fill={COLORS.gold} radius={[3,3,0,0]} isAnimationActive={false} />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>
        </CardChart>

        <CardChart title="Top 10 Maiores Gastos do Ano" height={210}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={top10} layout="vertical" margin={{ top: 2, right: 18, left: 6, bottom: 0 }}>
              <CartesianGrid stroke={COLORS.lineSoft} horizontal={false} />
              <XAxis type="number" tick={{ fontSize: 9.5, fill: COLORS.inkSoft }} tickFormatter={formatBRLShort} axisLine={false} tickLine={false} />
              <YAxis type="category" dataKey="categoria" tick={{ fontSize: 10.5, fill: COLORS.ink }} width={120} axisLine={false} tickLine={false} />
              <Tooltip content={<CustomTooltip />} cursor={{ fill: COLORS.lineSoft }} />
              <Bar dataKey="total" name="Total Acumulado" fill={COLORS.ink} radius={[0,3,3,0]} isAnimationActive={false} />
            </BarChart>
          </ResponsiveContainer>
        </CardChart>

        <CardChart title="Fixas x Variáveis" height={210}>
          <ResponsiveContainer width="100%" height="100%">
            <PieChart margin={{ top: 0, bottom: 0 }}>
              <Pie data={fixasVsVariaveis} dataKey="value" nameKey="name" cx="50%" cy="45%" innerRadius={42} outerRadius={68} paddingAngle={3} isAnimationActive={false}>
                {fixasVsVariaveis.map((entry, i) => <Cell key={i} fill={PIE_COLORS[i % PIE_COLORS.length]} />)}
              </Pie>
              <Tooltip content={<CustomTooltip />} />
              <Legend wrapperStyle={{ fontSize: 11, bottom: 0 }} />
            </PieChart>
          </ResponsiveContainer>
        </CardChart>

      </div>
    </div>
  );
}

const TIPO_COR = { 'Fixa': COLORS.ink, 'Variável': COLORS.red, 'Entrada': COLORS.green };
const TIPO_BG = { 'Fixa': COLORS.goldSoft, 'Variável': COLORS.redBg, 'Entrada': COLORS.greenBg };

function Lancamentos(props) {
  const {
    transacoes, agrupadoPorMes, filtroMes, setFiltroMes, filtroTexto, setFiltroTexto,
    mesesAbertos, toggleMes, removerLancamento, editarLancamento,
    novoMes, setNovoMes, novaCategoria, setNovaCategoria, novoTipo, setNovoTipo,
    novoValor, setNovoValor, novoStatus, setNovoStatus, adicionarLancamento,
    formErro, formOk, saldosMensais, salvarSaldoMensal, privadoTotais, setPrivadoTotais, privadoDetalhes, setPrivadoDetalhes,
  } = props;

  const [editandoId, setEditandoId] = useState(null);
  const [valorEdit, setValorEdit] = useState('');
  const [statusEdit, setStatusEdit] = useState('Pago');
  const [editandoValorOriginal, setEditandoValorOriginal] = useState(null);
  const [editandoHistoricoOriginal, setEditandoHistoricoOriginal] = useState(null);
  const [historicoEdit, setHistoricoEdit] = useState('');
  const [contaDigitada, setContaDigitada] = useState(false);
  const [saldoMesEdit, setSaldoMesEdit] = useState(MESES[MESES.length - 1]);
  const [saldoValorEdit, setSaldoValorEdit] = useState('');
  const [saldoSalvoToast, setSaldoSalvoToast] = useState(false);

  useEffect(() => {
    setSaldoValorEdit(formatBRLNumber((saldosMensais || {})[saldoMesEdit] || 0));
  }, [saldoMesEdit, saldosMensais]);

  function salvarSaldoDoMes() {
    const num = parseBRLInput(saldoValorEdit);
    if (num != null && salvarSaldoMensal) {
      salvarSaldoMensal(saldoMesEdit, num);
      setSaldoSalvoToast(true);
      setTimeout(() => setSaldoSalvoToast(false), 2200);
    }
  }

  // KPIs do mês em foco (o que estiver escolhido no filtro; se for "todos", usa o mês mais recente com dados)
  const kpisMes = useMemo(() => {
    const mesAlvo = filtroMes !== 'TODOS' ? filtroMes
      : [...MESES].reverse().find(m => transacoes.some(t => t.mes === m && t.status === 'Pago')) || 'AGOSTO';
    const doMes = transacoes.filter(t => t.mes === mesAlvo && t.status === 'Pago');
    const entradas = doMes.filter(t => t.tipo === 'Entrada').reduce((s, t) => s + (t.valor || 0), 0);
    const saidas = doMes.filter(t => t.tipo !== 'Entrada').reduce((s, t) => s + (t.valor || 0), 0);
    const saldoInfo = (saldosMensais || {})[mesAlvo];
    return { mesAlvo, entradas, saidas, resultado: entradas - saidas, saldo: saldoInfo || 0 };
  }, [transacoes, filtroMes, saldosMensais]);

  function iniciarEdicao(t) {
    setEditandoId(t.id);
    setValorEdit(t.valor != null ? formatBRLNumber(t.valor) : '');
    setStatusEdit(t.status);
    setEditandoValorOriginal(t.valor);
    setEditandoHistoricoOriginal(t.historico || null);
    setHistoricoEdit(t.historico || '');
    setContaDigitada(false);
  }
  function cancelarEdicao() {
    setEditandoId(null);
  }
  function salvarEdicao(id) {
    const valorFinal = parseBRLInput(valorEdit);
    // se a pessoa digitou uma conta (com +, -, * ou /) em vez de só um número novo,
    // guarda o "extrato" da conta pra poder conferir depois. O texto do histórico é
    // editável — se a pessoa apagou manualmente, respeita o que ela deixou.
    let historico = historicoEdit.trim() || null;
    if (contaDigitada && valorFinal != null && editandoValorOriginal != null && valorFinal !== editandoValorOriginal) {
      const diff = valorFinal - editandoValorOriginal;
      const termo = diff >= 0 ? `+${formatBRLNumber(diff)}` : `-${formatBRLNumber(Math.abs(diff))}`;
      const base = historico || formatBRLNumber(editandoValorOriginal);
      historico = `${base}${termo}=${formatBRLNumber(valorFinal)}`;
    }
    editarLancamento(id, { valor: valorFinal, status: statusEdit, historico });
    setEditandoId(null);
  }

  const inputStyle = {
    border: `1px solid ${COLORS.line}`, borderRadius: 7, padding: '9px 11px', fontSize: 13.5,
    fontFamily: 'Inter, sans-serif', background: '#FFFDF8', color: COLORS.ink,
  };

  return (
    <div style={{ display: 'grid', gap: 22 }}>

      {/* KPIs DO MÊS EM FOCO */}
      <div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.inkSoft, textTransform: 'uppercase', letterSpacing: '0.03em' }}>
            Resumo de {kpisMes.mesAlvo.charAt(0) + kpisMes.mesAlvo.slice(1).toLowerCase()}
          </div>
          <button onClick={() => setPrivadoTotais(v => !v)} title={privadoTotais ? 'Mostrar totais' : 'Esconder totais'} style={{
            background: 'none', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 5,
            color: COLORS.inkSoft, fontSize: 11.5, fontWeight: 600,
          }}>
            {privadoTotais ? <EyeOff size={15} /> : <Eye size={15} />}
            {privadoTotais ? 'Totais ocultos' : 'Ocultar totais'}
          </button>
        </div>
        <KPIStrip
          oculto={privadoTotais}
          items={[
            { label: 'Entradas do mês', valor: kpisMes.entradas, icon: TrendingUp, cor: COLORS.green, bg: COLORS.greenBg },
            { label: 'Saídas do mês', valor: kpisMes.saidas, icon: TrendingDown, cor: COLORS.red, bg: COLORS.redBg },
            { label: 'Resultado do mês', valor: kpisMes.resultado, icon: kpisMes.resultado >= 0 ? TrendingUp : TrendingDown, cor: kpisMes.resultado >= 0 ? COLORS.green : COLORS.red, bg: kpisMes.resultado >= 0 ? COLORS.greenBg : COLORS.redBg },
          ]}
          extra={
            <div style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: '14px 16px', boxShadow: '0 1px 2px rgba(31,59,54,0.06)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                <div style={{ background: COLORS.goldSoft, borderRadius: 6, padding: 5, display: 'flex' }}>
                  <Wallet size={13} color={COLORS.ink} />
                </div>
                <span style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600, letterSpacing: '0.03em', textTransform: 'uppercase' }}>Saldo em conta</span>
              </div>
              {privadoTotais ? (
                <div className="mono" style={{ fontSize: 15, fontWeight: 600, color: COLORS.ink, padding: '6px 0' }}>R$ ••••••</div>
              ) : (
                <>
                  <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                    <select value={saldoMesEdit} onChange={e => setSaldoMesEdit(e.target.value)} style={{
                      border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: '5px 6px', fontSize: 12,
                      fontFamily: 'Inter, sans-serif', background: '#FFFDF8', color: COLORS.ink, width: 62,
                    }}>
                      {MESES.map(m => <option key={m} value={m}>{MESES_ABREV[m]}</option>)}
                    </select>
                    <input value={saldoValorEdit} onChange={e => setSaldoValorEdit(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter') salvarSaldoDoMes(); }}
                      className="mono" style={{
                        border: `1px solid ${COLORS.line}`, borderRadius: 6, padding: '5px 6px', fontSize: 13,
                        fontFamily: 'Inter, sans-serif', background: '#FFFDF8', color: COLORS.ink, width: 78, minWidth: 0,
                      }} />
                    <button onClick={salvarSaldoDoMes} title="Salvar saldo" style={{
                      background: COLORS.inkButton, border: 'none', borderRadius: 6, padding: '6px 8px', cursor: 'pointer',
                      display: 'flex', alignItems: 'center', flexShrink: 0,
                    }}>
                      <Check size={13} color="#FFFFFF" />
                    </button>
                  </div>
                  {saldoSalvoToast && <div style={{ color: COLORS.green, fontSize: 11, fontWeight: 600, marginTop: 4 }}>✓ Salvo!</div>}
                </>
              )}
            </div>
          }
        />
      </div>

      <div style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: '20px 22px', boxShadow: '0 1px 2px rgba(31,59,54,0.06)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 16 }}>
          <Plus size={17} color={COLORS.gold} />
          <h3 className="serif" style={{ fontSize: 16, fontWeight: 600, margin: 0, color: COLORS.ink }}>Novo lançamento</h3>
          <span style={{ fontSize: 12, color: COLORS.inkSoft }}>— anote aqui cada saque, compra ou entrada (aceita somas como 900+150)</span>
        </div>
        <form onSubmit={adicionarLancamento} className="grid-form-lanc" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px, 1fr))', gap: 10, alignItems: 'end' }}>
          <div style={{ display: 'grid', gap: 4 }}>
            <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>MÊS</label>
            <select value={novoMes} onChange={e => setNovoMes(e.target.value)} style={inputStyle}>
              {MESES.map(m => <option key={m} value={m}>{MESES_ABREV[m]}</option>)}
            </select>
          </div>
          <div style={{ display: 'grid', gap: 4 }}>
            <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>O QUÊ</label>
            <input list="categorias-lista" value={novaCategoria} onChange={e => setNovaCategoria(e.target.value)}
              placeholder="ex: Mercado, Saque Sicoob..." style={inputStyle} spellCheck="true" lang="pt-BR" />
            <datalist id="categorias-lista">
              {CATEGORIAS_CONHECIDAS.map(c => <option key={c} value={c} />)}
            </datalist>
          </div>
          <div style={{ display: 'grid', gap: 4 }}>
            <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>TIPO</label>
            <select value={novoTipo} onChange={e => setNovoTipo(e.target.value)} style={inputStyle}>
              <option>Fixa</option>
              <option>Variável</option>
            </select>
          </div>
          <div style={{ display: 'grid', gap: 4 }}>
            <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>VALOR (R$)</label>
            <input
              value={novoValor}
              onChange={e => setNovoValor(e.target.value)}
              onBlur={() => onBlurCalc(novoValor, setNovoValor)}
              placeholder="0,00 ou ex: 900+150"
              style={{...inputStyle}}
              className="mono"
              title="Você pode digitar contas como 900+150 ou 1500-200"
            />
          </div>
          <div style={{ display: 'grid', gap: 4 }}>
            <label style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>STATUS</label>
            <select value={novoStatus} onChange={e => setNovoStatus(e.target.value)} style={inputStyle}>
              <option>Pago</option>
              <option>Pendente</option>
            </select>
          </div>
          <button type="submit" style={{
            background: COLORS.inkButton, color: '#FFFDF8', border: 'none', borderRadius: 7, padding: '10px 16px',
            fontWeight: 600, fontSize: 13.5, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6, height: 39,
          }}><Plus size={15}/> Lançar</button>
        </form>
        {formErro && <div style={{ color: COLORS.red, fontSize: 12.5, marginTop: 10 }}>{formErro}</div>}
        <Toast mensagem={formOk ? '✓ Lançamento adicionado com sucesso!' : null} />
      </div>

      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
        <div style={{ position: 'relative', flex: '1 1 240px' }}>
          <Search size={15} color={COLORS.inkSoft} style={{ position: 'absolute', left: 12, top: 11 }} />
          <input value={filtroTexto} onChange={e => setFiltroTexto(e.target.value)} placeholder="Buscar por nome ou valor (ex: mercado ou 1500)..."
            style={{ ...inputStyle, width: '100%', paddingLeft: 34, boxSizing: 'border-box' }} />
        </div>
        <select value={filtroMes} onChange={e => setFiltroMes(e.target.value)} style={inputStyle}>
          <option value="TODOS">Todos os meses</option>
          {MESES.map(m => <option key={m} value={m}>{MESES_ABREV[m]}</option>)}
        </select>
        <button onClick={() => setPrivadoDetalhes(v => !v)} title={privadoDetalhes ? 'Mostrar valores da lista' : 'Esconder valores da lista'} style={{
          background: 'none', border: `1px solid ${COLORS.line}`, borderRadius: 7, cursor: 'pointer', padding: '9px 12px',
          display: 'flex', alignItems: 'center', gap: 5, color: COLORS.inkSoft, fontSize: 12.5, fontWeight: 600, height: 39, boxSizing: 'border-box',
        }}>
          {privadoDetalhes ? <EyeOff size={14} /> : <Eye size={14} />}
          {privadoDetalhes ? 'Lista oculta' : 'Ocultar lista'}
        </button>
      </div>

      <div style={{ display: 'grid', gap: 14 }}>
        {agrupadoPorMes.length === 0 && (
          <div style={{ textAlign: 'center', color: COLORS.inkSoft, padding: '40px 0', fontSize: 14 }}>Nenhum lançamento encontrado.</div>
        )}
        {agrupadoPorMes.map(({ mes, itens }) => {
          const aberto = mesesAbertos[mes] === true || (!!filtroTexto && itens.length > 0);
          const totalMes = itens.reduce((s,t) => s + (t.tipo === 'Entrada' ? t.valor : -t.valor), 0);
          return (
            <div key={mes} style={{ background: COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: 'hidden' }}>
              <button onClick={() => toggleMes(mes)} style={{
                width: '100%', display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                padding: '13px 18px', background: COLORS.lineSoft, border: 'none', cursor: 'pointer',
              }}>
                <span className="serif" style={{ fontWeight: 600, fontSize: 15, color: COLORS.ink }}>
                  {mes.charAt(0) + mes.slice(1).toLowerCase()} <span style={{ fontSize: 12.5, color: COLORS.inkSoft, fontFamily: 'Inter, sans-serif', fontWeight: 500 }}>({itens.length} lançamentos)</span>
                </span>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <span className="mono" style={{ fontSize: 13.5, fontWeight: 600, color: totalMes >= 0 ? COLORS.green : COLORS.red }}>{formatBRLPrivado(totalMes, privadoDetalhes)}</span>
                  <ChevronDown size={16} color={COLORS.inkSoft} style={{ transform: aberto ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s' }} />
                </div>
              </button>
              {aberto && (
                <div>
                  {itens.map(t => {
                    const emEdicao = editandoId === t.id;
                    const semValor = t.valor == null;
                    return (
                    <div key={t.id} style={{
                      display: 'grid', gridTemplateColumns: '1fr auto auto auto auto auto', gap: 12, alignItems: 'center',
                      padding: '9px 18px', borderTop: `1px solid ${COLORS.lineSoft}`, fontSize: 13.5,
                      background: semValor && !emEdicao ? '#FFFBF0' : 'transparent',
                    }}>
                      <div>
                        <span style={{ color: COLORS.ink }}>{t.categoria}</span>
                        {emEdicao ? (
                          (historicoEdit || t.historico) && (
                            <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginTop: 3 }}>
                              <input value={historicoEdit} onChange={e => setHistoricoEdit(e.target.value)}
                                placeholder="extrato da conta (pode apagar)"
                                style={{ ...inputStyle, fontSize: 11.5, padding: '3px 6px', fontFamily: 'monospace', width: 200 }} />
                              <button type="button" onClick={() => setHistoricoEdit('')} title="Apagar histórico"
                                style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 2, opacity: 0.6 }}>
                                <X size={13} color={COLORS.red} />
                              </button>
                            </div>
                          )
                        ) : t.historico && (
                          <div style={{ fontSize: 12, color: COLORS.inkSoft, fontFamily: 'monospace', marginTop: 2 }}>
                            {t.historico}
                          </div>
                        )}
                      </div>
                      <span style={{
                        fontSize: 10.5, fontWeight: 700, letterSpacing: '0.03em', color: TIPO_COR[t.tipo],
                        background: TIPO_BG[t.tipo],
                        padding: '3px 8px', borderRadius: 20, textTransform: 'uppercase', justifySelf: 'start',
                      }}>{t.tipo}</span>

                      {emEdicao ? (
                        <select value={statusEdit} onChange={e => setStatusEdit(e.target.value)} style={{ ...inputStyle, padding: '5px 8px', fontSize: 12 }}>
                          <option>Pago</option>
                          <option>Pendente</option>
                        </select>
                      ) : (
                        <span style={{ fontSize: 11.5, color: t.status === 'Pago' ? COLORS.green : COLORS.gold, fontWeight: 600 }}>{t.status}</span>
                      )}

                      {emEdicao ? (
                        <input
                          autoFocus
                          value={valorEdit}
                          onChange={e => setValorEdit(e.target.value)}
                          onBlur={() => { if (valorEdit && /[\+\-\*\/]/.test(valorEdit)) setContaDigitada(true); onBlurCalc(valorEdit, setValorEdit); }}
                          onKeyDown={e => { if (e.key === 'Enter') salvarEdicao(t.id); if (e.key === 'Escape') cancelarEdicao(); }}
                          placeholder="0,00 ou 900+150"
                          className="mono"
                          style={{ ...inputStyle, padding: '5px 8px', width: 120, textAlign: 'right' }}
                          title="Aceita somas como 900+150 ou 1500-200"
                        />
                      ) : semValor ? (
                        <button onClick={() => iniciarEdicao(t)} style={{
                          background: 'none', border: `1px dashed ${COLORS.gold}`, color: COLORS.gold, borderRadius: 6,
                          padding: '4px 10px', fontSize: 12, fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap',
                        }}>lançar valor</button>
                      ) : (
                        <span className="mono" style={{ fontWeight: 600, color: t.tipo === 'Entrada' ? COLORS.green : COLORS.ink, minWidth: 100, textAlign: 'right' }}>
                          {t.tipo === 'Entrada' ? '+' : '−'} {formatBRLPrivado(t.valor, privadoDetalhes)}
                        </span>
                      )}

                      {emEdicao ? (
                        <div style={{ display: 'flex', gap: 4 }}>
                          <button onClick={() => salvarEdicao(t.id)} style={{ background: COLORS.green, color: '#FFFFFF', border: 'none', borderRadius: 6, padding: '4px 8px', cursor: 'pointer', fontSize: 11, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 2 }}>
                            <Check size={12} color="#FFFFFF" /> Salvar
                          </button>
                          <button onClick={cancelarEdicao} style={{ background: COLORS.redBg, color: COLORS.red, border: `1px solid ${COLORS.red}44`, borderRadius: 6, padding: '4px 6px', cursor: 'pointer' }}>
                            <X size={12} color={COLORS.red} />
                          </button>
                        </div>
                      ) : (
                        <div style={{ display: 'flex', gap: 2 }}>
                          <button onClick={() => iniciarEdicao(t)} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4, opacity: 0.5 }}
                            onMouseEnter={e => e.currentTarget.style.opacity = 1} onMouseLeave={e => e.currentTarget.style.opacity = 0.5}>
                            <Pencil size={13} color={COLORS.ink} />
                          </button>
                          <button onClick={() => removerLancamento(t.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4, opacity: 0.5 }}
                            onMouseEnter={e => e.currentTarget.style.opacity = 1} onMouseLeave={e => e.currentTarget.style.opacity = 0.5}>
