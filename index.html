<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#651B58">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Tempo de Brincar</title>
  <style>
    html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fffdf8;color:#1f1f24}
    main{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .box{max-width:420px;padding:28px;border:1px solid rgba(100,100,120,.14);border-radius:28px;background:rgba(255,255,255,.72);box-shadow:0 18px 60px rgba(50,40,70,.10);backdrop-filter:blur(20px)}
    .dot{width:12px;height:12px;border-radius:50%;background:#27b36a;display:inline-block;margin-right:8px}
  </style>
</head>
<body>
  <main><div class="box"><h2>Tempo de Brincar</h2><p><span class="dot"></span>Abrindo o painel…</p><p style="font-size:13px;opacity:.65">A interface abre pelo Git e o Google Drive sincroniza em segundo plano.</p></div></main>
  <script>
    (async function(){
      var fallbackBuild='v47-git';
      var build=fallbackBuild;
      try {
        var vr=await fetch('./version.json?_='+Date.now(),{cache:'no-store'});
        if(vr.ok){var vj=await vr.json();if(vj&&vj.build)build=String(vj.build);}
      } catch(e) {}
      if('serviceWorker' in navigator){
        try { await navigator.serviceWorker.register('./sw.js?build='+encodeURIComponent(build)); } catch(e) {}
      }
      var ua=navigator.userAgent||'';
      var phone=/iPhone|iPod|Windows Phone|Android.*Mobile/i.test(ua);
      location.replace((phone?'./mobile.html':'./desktop.html')+'?build='+encodeURIComponent(build));
    })();
  </script>
</body>
</html>
