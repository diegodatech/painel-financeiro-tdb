<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FFFDF8">
  <meta name="background-color" content="#FFFDF8">
  <title>Painel Financeiro - Tempo de Brincar</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root{--paper:#fffdf8;--soft:#6c817f;--gold:#d79b2e;--line:#dfecea}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:var(--paper);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
    #painel{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--paper);z-index:1;visibility:hidden}
    #painel.visivel{visibility:visible}
    #splash{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
    #splash.oculto{display:none}
    .conteudo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
    .logo{width:min(46vw,220px);height:auto;max-height:150px;object-fit:contain}
    .status{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--soft);font-size:13px;font-weight:600}
    .spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--gold);animation:girar .8s linear infinite;flex:none}
    @keyframes girar{to{transform:rotate(360deg)}}
    @media (min-width:900px){.logo{width:250px;max-height:170px}.status{font-size:14px}}
  </style>
</head>
<body>
  <div id="splash" aria-live="polite">
    <div class="conteudo">
      <img class="logo" src="./logo.png" alt="Escola Infantil Tempo de Brincar">
      <div class="status"><span class="spinner" aria-hidden="true"></span><span id="statusTexto">Sincronizando Google Drive…</span></div>
    </div>
  </div>

  <iframe
    id="painel"
    title="Painel Financeiro"
    allow="clipboard-read; clipboard-write"
    src="https://script.google.com/macros/s/AKfycbw0CRh3ZyFfQkjRz4vRhymlBd489xDWvswt4NlZt4nc_Lf6ZoDlTQh11OfTctiJaxnnTA/exec?acao=painel&pwa=1">
  </iframe>

  <script>
    (() => {
      const frame = document.getElementById('painel');
      const splash = document.getElementById('splash');
      const statusTexto = document.getElementById('statusTexto');
      let liberado = false;

      const revelar = () => {
        if (liberado) return;
        liberado = true;
        frame.classList.add('visivel');
        splash.classList.add('oculto');
      };

      // O iframe trabalha em segundo plano. Só trocamos de tela quando o PIN
      // (ou o painel já desbloqueado) estiver pronto. Assim não aparecem as
      // telas internas de "conectando", "buscando backup" etc.
      window.addEventListener('message', (event) => {
        if (!event || !event.data) return;
        if (event.data.type === 'TDB_PAINEL_READY') revelar();
        if (event.data.type === 'TDB_PAINEL_ERROR') {
          statusTexto.textContent = 'Não foi possível sincronizar. Toque para tentar novamente.';
          splash.style.cursor = 'pointer';
          splash.onclick = () => location.reload();
        }
      });

      // Não revelamos o iframe por tempo limite. Se o Drive demorar, permanece
      // na MESMA tela de sincronização em vez de mostrar etapas intermediárias.
      setTimeout(() => {
        if (!liberado) statusTexto.textContent = 'Sincronizando Google Drive…';
      }, 15000);

      // Mantém o PWA sempre buscando o launcher mais novo. O Service Worker v4
      // não guarda o index em cache, evitando ficar preso numa abertura antiga.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('./sw.js');
            await reg.update().catch(() => {});
          } catch (e) {
            console.warn('Service Worker não registrado:', e);
          }
        });
      }
    })();
  </script>
</body>
</html>
