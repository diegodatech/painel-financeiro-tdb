<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
  <meta name="theme-color" content="#FFFDF8">
  <meta name="background-color" content="#FFFDF8">
  <title>Painel Financeiro - Tempo de Brincar</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="manifest" href="./manifest.webmanifest?v=9">
  <link rel="icon" href="./icon-192.png?v=9">
  <link rel="apple-touch-icon" href="./icon-192.png?v=9">
  <style>
    :root{--paper:#fffdf8;--soft:#6c817f;--gold:#d79b2e;--line:#dfecea}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:var(--paper);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
    #painel{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--paper);z-index:1;opacity:0;pointer-events:none;transition:opacity .12s ease}
    #painel.visivel{opacity:1;pointer-events:auto}
    #splash{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity .12s ease,visibility .12s ease}
    #splash.oculto{opacity:0;visibility:hidden;pointer-events:none}
    .conteudo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
    .logo{width:min(46vw,220px);height:auto;max-height:150px;object-fit:contain}
    .status{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--soft);font-size:13px;font-weight:600}
    .spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--gold);animation:girar .8s linear infinite;flex:none}
    @keyframes girar{to{transform:rotate(360deg)}}
    @media (min-width:900px){.logo{width:250px;max-height:170px}.status{font-size:14px}}
  </style>
</head>
<body>
  <div id="splash" aria-live="polite">
    <div class="conteudo">
      <img class="logo" src="./logo.png?v=9" alt="Escola Infantil Tempo de Brincar">
      <div class="status"><span class="spinner" aria-hidden="true"></span><span id="statusTxt">Abrindo painel…</span></div>
    </div>
  </div>
  <iframe id="painel" title="Painel Financeiro" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    (() => {
      const LAUNCHER_VERSION = '9';
      const MOBILE_BUILD = '2.4';
      const APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbw0CRh3ZyFfQkjRz4vRhymlBd489xDWvswt4NlZt4nc_Lf6ZoDlTQh11OfTctiJaxnnTA/exec';
      const frame = document.getElementById('painel');
      const splash = document.getElementById('splash');
      const statusTxt = document.getElementById('statusTxt');
      let liberado = false;

      function detectarCelular() {
        const ua = navigator.userAgent || '';
        const porUA = /iPhone|iPod|Android.+Mobile|Windows Phone|IEMobile|Opera Mini|webOS|BlackBerry/i.test(ua);
        const largura = Math.min(
          window.innerWidth || 9999,
          (window.visualViewport && window.visualViewport.width) || 9999,
          screen.width || 9999
        );
        const porLargura = largura <= 767;
        return porUA || porLargura;
      }

      const usarMobile = detectarCelular();
      const rota = usarMobile ? 'painelMobile' : 'painel';
      if (statusTxt) statusTxt.textContent = usarMobile ? 'Abrindo versão celular…' : 'Abrindo painel…';

      // Query exclusiva desta versão força uma navegação nova e evita reaproveitar
      // respostas antigas do iframe/navegador. No celular, a rota é SEMPRE painelMobile.
      const qs = new URLSearchParams({
        acao: rota,
        pwa: '1',
        launcher: LAUNCHER_VERSION,
        build: usarMobile ? MOBILE_BUILD : 'desktop',
        _: String(Date.now())
      });
      frame.src = APPS_SCRIPT + '?' + qs.toString();

      const revelar = () => {
        if (liberado) return;
        liberado = true;
        frame.classList.add('visivel');
        splash.classList.add('oculto');
      };
      frame.addEventListener('load', revelar, { once: true });
      setTimeout(revelar, 7000);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            // Migração para V9: apaga caches dos launchers anteriores uma única vez.
            if (localStorage.getItem('tdbLauncherVersion') !== LAUNCHER_VERSION) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(r => r.unregister().catch(() => false)));
              if ('caches' in window) {
                const keys = await caches.keys();
                await Promise.all(keys.filter(k => k.startsWith('tdb-launcher-')).map(k => caches.delete(k)));
              }
              localStorage.setItem('tdbLauncherVersion', LAUNCHER_VERSION);
            }
            const reg = await navigator.serviceWorker.register('./sw.js?v=9');
            await reg.update().catch(() => {});
          } catch (e) {
            console.warn('Service Worker não registrado:', e);
          }
        });
      }
    })();
  </script>
</body>
</html>
